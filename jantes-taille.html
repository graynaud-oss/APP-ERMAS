<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Recherche Jantes par Taille</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script><script type="module" src="./js/home-navigation.js"></script>
</head>
<body>
    <div class="app-shell catalog-page results-page">
<header class="app-header"><div class="app-container app-header__inner"><a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a><button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button></div></header>

    <!-- CONTENU PRINCIPAL -->
    <main class="catalog-page__body"><div class="app-container"><section class="app-page-panel results-page__panel">
            <div class="app-page-header">
                <div>
                    <p class="app-page-eyebrow">Catalogue Jantes</p>
                    <h1 class="app-page-title">Recherche par taille de jante</h1>
                    <p class="app-page-subtitle">Sélectionnez les dimensions étape par étape</p>
                </div>
                <button onclick="window.location.href = 'jantes.html'" class="app-back-button">Retour</button>
            </div>

            <div class="results-search-panel">
            <!-- ÉTAPE 1 : DIAMÈTRE -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">1. Diamètre</label>
                <select id="select-diametre" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Chargement des données...</option>
                </select>
            </div>

            <!-- ÉTAPE 2 : LARGEUR -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">2. Largeur de jante</label>
                <select id="select-largeur" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord un diamètre</option>
                </select>
            </div>

            <!-- ÉTAPE 3 : PROFIL -->
            <div class="mb-6">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">3. Profil</label>
                <select id="select-profil" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord une largeur</option>
                </select>
            </div>

            <!-- RÉSULTATS (NOM & PRIX) -->
            </div>
            <div id="results-container" class="hidden results-section">
                <div class="results-section__header">
                    <h2 class="results-section__title">Produit correspondant :</h2>
                    <div id="net-price-control" class="net-price-control hidden">
                        <label class="net-price-toggle" for="net-price-toggle" aria-label="Afficher ou masquer les prix NET">
                            <span>Prix NET</span>
                            <input id="net-price-toggle" class="net-price-toggle__input" type="checkbox" disabled>
                            <span class="net-price-toggle__track" aria-hidden="true"></span>
                            <span id="net-price-toggle-state" class="net-price-toggle__state" aria-live="polite">OFF</span>
                        </label>
                    </div>
                </div>
                <div id="results-content" class="results-content">
                    <!-- Injecté dynamiquement -->
                </div>
            </div>
        </section></div></main>

    <footer class="app-footer"><div class="app-container app-footer__inner"><p>&copy; 2026 ERMAS - Tous droits réservés.</p><nav class="app-footer__links" aria-label="Informations juridiques"><a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a><span aria-hidden="true">|</span><a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a></nav></div></footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';
        import { isNetPriceVisible, setNetPriceVisible } from './js/net-price-visibility.js';
        import { buildWheelDimensionIndex, getVariableWayState, NARROW_WHEELS_CSV_URL, VARIABLE_WAY_STATES } from './js/wheel-dimension-index.js';
        import { escapeHtml } from './js/safe-dom.js';
        import { PRODUCT_OPTION_FAMILIES, renderAvailableProductOptions } from './js/product-options.js';

        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=1966421754&single=true&output=csv';
        const supabaseClient = getSupabaseClient();

        let csvData = [];
        let userRemise = 0;
        let netPriceVisible = false;
        let pageAuthorized = false;
        let narrowWheelDimensions = new Set();

        const selDiametre = document.getElementById('select-diametre');
        const selLargeur = document.getElementById('select-largeur');
        const selProfil = document.getElementById('select-profil');
        const resultsContainer = document.getElementById('results-container');
        const resultsContent = document.getElementById('results-content');
        const netPriceControl = document.getElementById('net-price-control');
        const netPriceToggle = document.getElementById('net-price-toggle');
        const netPriceToggleState = document.getElementById('net-price-toggle-state');

        async function initPage() {
            let context;
            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            if (context.profile && context.profile.remise) {
                userRemise = parseFloat(context.profile.remise) || 0;
            }
            netPriceVisible = isNetPriceVisible();
            netPriceToggle.checked = netPriceVisible;
            netPriceToggle.disabled = false;
            updateNetPriceToggleState();
            netPriceToggle.addEventListener('change', () => {
                if (!pageAuthorized) return;
                netPriceVisible = setNetPriceVisible(netPriceToggle.checked);
                updateNetPriceVisibility();
            });
            pageAuthorized = true;

            try {
                const narrowWheelIndexPromise = fetch(NARROW_WHEELS_CSV_URL)
                    .then((response) => {
                        if (!response.ok) throw new Error('Catalogue Roues étroites indisponible');
                        return response.text();
                    })
                    .then((text) => buildWheelDimensionIndex(text))
                    .catch(() => new Set());
                const response = await fetch(SHEET_CSV_URL);
                if (!response.ok) throw new Error('Catalogue Jantes indisponible');
                const [text, loadedNarrowWheelDimensions] = await Promise.all([
                    response.text(),
                    narrowWheelIndexPromise
                ]);
                narrowWheelDimensions = loadedNarrowWheelDimensions;
                parseCSV(text);
            } catch (err) {
                selDiametre.innerHTML = '<option value="">Erreur de chargement des données</option>';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            csvData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',').map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 10) {
                    const prixVFVal = cols[6];
                    const prixVVVal = cols[7];

                    const hasVF = prixVFVal && !isNaN(parseFloat(prixVFVal));
                    const hasVV = prixVVVal && !isNaN(parseFloat(prixVVVal));
                    if (!hasVF && !hasVV) continue;

                    csvData.push({
                        largeurJante: cols[0],
                        diametre: cols[1],
                        horsTout: cols[2],
                        emboitement: cols[3],
                        profil: cols[4],
                        nom: cols[5],
                        prixVF: prixVFVal,
                        prixVV: prixVVVal,
                        deportMaxI: cols[8],
                        deportMinJ: cols[9]
                    });
                }
            }
            populateDiametres();
        }

        function updateNetPriceToggleState() {
            netPriceToggleState.textContent = netPriceVisible ? 'ON' : 'OFF';
        }

        function updateNetPriceVisibility() {
            resultsContent.querySelectorAll('[data-net-price]').forEach((element) => {
                element.hidden = !netPriceVisible;
            });

            const hasNetPrice = userRemise > 0 && resultsContent.querySelector('[data-net-price]');
            netPriceControl.classList.toggle('hidden', !hasNetPrice);
            netPriceToggle.checked = netPriceVisible;
            updateNetPriceToggleState();
        }

        function populateDiametres() {
            const diametres = [...new Set(csvData.map(item => item.diametre))].filter(Boolean);
            diametres.sort((a, b) => parseFloat(a) - parseFloat(b));

            selDiametre.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
            diametres.forEach(d => {
                selDiametre.innerHTML += `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`;
            });
            selDiametre.disabled = false;
        }

        selDiametre.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenD = selDiametre.value;
            selLargeur.innerHTML = '<option value="">-- Sélectionnez une largeur --</option>';
            selProfil.innerHTML = '<option value="">Sélectionnez d\'abord une largeur</option>';
            selLargeur.disabled = true;
            selProfil.disabled = true;
            resultsContainer.classList.add('hidden');

            if (!chosenD) return;

            const filtered = csvData.filter(item => item.diametre === chosenD);
            const largeurs = [...new Set(filtered.map(item => item.largeurJante))].filter(Boolean);
            largeurs.sort((a, b) => parseFloat(a) - parseFloat(b));

            largeurs.forEach(l => {
                selLargeur.innerHTML += `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`;
            });
            selLargeur.disabled = false;
        });

        selLargeur.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenD = selDiametre.value;
            const chosenL = selLargeur.value;
            selProfil.innerHTML = '<option value="">-- Sélectionnez un profil --</option>';
            selProfil.disabled = true;
            resultsContainer.classList.add('hidden');

            if (!chosenL) return;

            const filtered = csvData.filter(item => item.diametre === chosenD && item.largeurJante === chosenL);
            const profils = [...new Set(filtered.map(item => item.profil))];

            profils.forEach(p => {
                const label = p === "" ? "(Sans profil / Standard)" : p;
                selProfil.innerHTML += `<option value="${escapeHtml(p)}">${escapeHtml(label)}</option>`;
            });
            selProfil.disabled = false;
        });

        selProfil.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenD = selDiametre.value;
            const chosenL = selLargeur.value;
            const chosenP = selProfil.value;

            const match = csvData.find(item => 
                item.diametre === chosenD && 
                item.largeurJante === chosenL && 
                item.profil === chosenP
            );

            if (!match) {
                resultsContainer.classList.add('hidden');
                return;
            }

            let html = `
                <div class="bg-[#070913] border border-gray-800 p-4 rounded-xl space-y-3">
                    <div>
                        <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold">Nom du produit</span>
                        <div class="text-white text-base font-bold tracking-wide">${escapeHtml(match.nom || 'N/A')}</div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-800/80">
            `;

            // VOIE FIXE
            if (match.prixVF && !isNaN(parseFloat(match.prixVF))) {
                const baseVF = parseFloat(match.prixVF);
                const finalVF = userRemise > 0 ? baseVF * (1 - userRemise / 100) : baseVF;
                
                html += `
                    <div class="results-price-block">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie fixe</span>
                `;
                
                if (userRemise > 0) {
                    html += `
                            <div class="text-[10px] text-gray-400 mt-1">Prix BRUT : <span class="text-white font-medium">${baseVF.toFixed(2)} €</span></div>
                        </div>
                        <div data-net-price ${netPriceVisible ? '' : 'hidden'} class="mt-2 pt-2 border-t border-gray-800/60">
                            <div class="text-[10px] uppercase tracking-wider text-red-400 font-semibold">Prix NET</div>
                            <div class="text-white font-bold text-sm">${finalVF.toFixed(2)} €</div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Prix BRUT</div>
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-800/60">
                            <div class="text-white font-bold text-sm">${finalVF.toFixed(2)} €</div>
                        </div>
                    `;
                }
                html += `</div>`;
            } else {
                html += `
                    <div class="results-price-block">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie fixe</span>
                        <div class="text-gray-500 text-xs italic my-auto">Non disponible</div>
                    </div>
                `;
            }

            // VOIE VARIABLE
            const hasValidVariablePrice = Boolean(match.prixVV && !isNaN(parseFloat(match.prixVV)));
            const variableWayState = getVariableWayState({
                hasValidVariablePrice,
                diameter: match.diametre,
                width: match.largeurJante,
                narrowWheelDimensions
            });

            if (variableWayState === VARIABLE_WAY_STATES.PRICE) {
                const baseVV = parseFloat(match.prixVV);
                const finalVV = userRemise > 0 ? baseVV * (1 - userRemise / 100) : baseVV;
                
                html += `
                    <div class="results-price-block">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie variable</span>
                `;

                if (userRemise > 0) {
                    html += `
                            <div class="text-[10px] text-gray-400 mt-1">Prix BRUT : <span class="text-white font-medium">${baseVV.toFixed(2)} €</span></div>
                        </div>
                        <div data-net-price ${netPriceVisible ? '' : 'hidden'} class="mt-2 pt-2 border-t border-gray-800/60">
                            <div class="text-[10px] uppercase tracking-wider text-red-400 font-semibold">Prix NET</div>
                            <div class="text-white font-bold text-sm">${finalVV.toFixed(2)} €</div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Prix BRUT</div>
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-800/60">
                            <div class="text-white font-bold text-sm">${finalVV.toFixed(2)} €</div>
                        </div>
                    `;
                }
                html += `</div>`;
            } else if (variableWayState === VARIABLE_WAY_STATES.NARROW_WHEELS) {
                html += `
                    <div class="results-price-block results-catalog-fallback">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie variable</span>
                        <span class="results-catalog-fallback__message">Cette dimension est disponible dans le catalogue Roues étroites.</span>
                        <button type="button" onclick="window.location.href = 'roues-etroites.html'" class="results-catalog-fallback__action">Voir Roues étroites</button>
                    </div>
                `;
            } else {
                html += `
                    <div class="results-price-block">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie variable</span>
                        <div class="text-gray-500 text-xs italic my-auto">Non disponible</div>
                    </div>
                `;
            }

            html += `</div>`;

            // BOUTON DE CALCUL DE VOIE
            const hasValidI = match.deportMaxI && !isNaN(parseFloat(match.deportMaxI));
            const hasValidJ = match.deportMinJ && !isNaN(parseFloat(match.deportMinJ));

            if (hasValidI && hasValidJ) {
                html += `
                    <div class="pt-2">
                        <button onclick='ouvrirCalculateur(${escapeHtml(JSON.stringify(match))})' class="results-primary-action">
                            Estimer la voie de travail
                        </button>
                    </div>
                `;
            }

            html += `</div>`;
            html += renderAvailableProductOptions({
                family: PRODUCT_OPTION_FAMILIES.STANDARD_WHEELS,
                discount: userRemise,
                netPriceVisible,
                hasResults: true
            });
            resultsContent.innerHTML = html;
            updateNetPriceVisibility();
            resultsContainer.classList.remove('hidden');
        });

        window.ouvrirCalculateur = function(product) {
            if (!pageAuthorized) return;

            sessionStorage.setItem('ermas_calc_product', JSON.stringify(product));
            window.location.href = 'calcul-voie.html?source=jantes-taille';
        };

        initPage().catch(() => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
