<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Prestation technique</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script><script type="module" src="./js/home-navigation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="repair-service-view" class="hidden app-shell catalog-page repair-service-page">
        <header class="app-header"><div class="app-container app-header__inner"><a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a><button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button></div></header>
        <main class="catalog-page__body"><div class="app-container"><section class="app-page-panel" aria-labelledby="repair-service-title">
            <div class="app-page-header"><div><p class="app-page-eyebrow">Services techniques</p><h1 id="repair-service-title" class="app-page-title"></h1><p id="repair-service-description" class="app-page-subtitle"></p></div><div class="app-page-actions"><button id="repair-service-back" type="button" class="app-back-button">Retour</button></div></div>
            <div class="repair-service-layout">
                <figure id="repair-service-media" class="repair-service-media" hidden></figure>
                <div class="repair-service-selection"><p id="repair-service-status" class="app-notice" role="status" hidden></p><form id="repair-service-form" class="repair-service-form"></form><div id="net-price-control" class="net-price-control hidden"><label class="net-price-toggle" for="net-price-toggle" aria-label="Afficher ou masquer le prix NET"><span>Prix NET</span><input id="net-price-toggle" class="net-price-toggle__input" type="checkbox"><span class="net-price-toggle__track" aria-hidden="true"></span><span id="net-price-toggle-state" class="net-price-toggle__state" aria-live="polite">OFF</span></label></div><div id="repair-service-result" aria-live="polite" hidden></div></div>
            </div>
        </section></div></main>
        <footer class="app-footer"><div class="app-container app-footer__inner"><p>&copy; 2026 ERMAS - Tous droits réservés.</p><nav class="app-footer__links" aria-label="Informations juridiques"><a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a><span aria-hidden="true">|</span><a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a></nav></div></footer>
    </div>
    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';
        import { getRepairService, loadRepairsCatalog } from './js/repairs-catalog.js';
        import { initializeRepairServicePage, showRepairCatalogUnavailable } from './js/repairs-page.js';

        const client = getSupabaseClient();
        const view = document.getElementById('repair-service-view');
        let pageAuthorized = false;

        async function initPage() {
            const context = await requireAuthorizedUser({ client });
            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) { window.location.href = 'index.html'; return; }
            const type = new URLSearchParams(window.location.search).get('type');
            if (!getRepairService(type)) { window.location.href = 'reparations-modifications.html'; return; }
            pageAuthorized = true;
            view.classList.remove('hidden');
            try {
                await loadRepairsCatalog();
                if (!initializeRepairServicePage({ serviceId: type, remise: context.profile?.remise })) { window.location.href = 'reparations-modifications.html'; }
            } catch {
                showRepairCatalogUnavailable(type);
            }
            document.querySelectorAll('[data-protected-route]').forEach((button) => button.addEventListener('click', () => { if (pageAuthorized) window.location.href = button.dataset.protectedRoute; }));
        }

        initPage().catch(() => { pageAuthorized = false; window.location.href = 'index.html'; });
    </script>
</body>
</html>
