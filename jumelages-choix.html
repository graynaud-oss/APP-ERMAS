<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Choix de Recherche Jumelages</title>
    <!-- Favicon personnalisé -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 id="page-title" class="font-brand text-xl sm:text-2xl font-bold text-white">Catalogue Jumelages</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Sélectionnez une option :</p>
                </div>
                <button onclick="history.back()" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
            </div>

            <!-- CONTENU CONDITIONNEL (OPTIONS DE RECHERCHE OU EN COURS DE CONFIGURATION) -->
            <div id="content-container">
                <!-- Injecté dynamiquement selon la gamme -->
            </div>
        </div>
    </div>

    <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        &copy; 2026 ERMAS - Tous droits réservés.
    </footer>

    <script>
        const SUPABASE_URL = 'https://wtxmaolhztuvujtgouaw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0eG1hb2xoenR1dnVqdGdvdWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjgzMDIsImV4cCI6MjEwMTQwNDMwMn0.ttuoJAutNJ98KDz45Te40VOqLyMIuda7n2CtaFK8IGg';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        // Récupération du type de gamme passé dans l'URL (ex: ?type=EVO, 360, TGD, TGD+)
        const urlParams = new URLSearchParams(window.location.search);
        const gammeType = urlParams.get('type') || 'EVO';

        document.getElementById('page-title').textContent = `Catalogue Jumelages - Gamme ${gammeType}`;

        const contentContainer = document.getElementById('content-container');

        if (gammeType === 'TGD' || gammeType === 'TGD+') {
            contentContainer.innerHTML = `
                <div class="space-y-4 mb-6">
                    <div class="p-4 bg-[#070913] border border-gray-800 rounded-xl text-center text-gray-400 text-sm">
                        Contenu de la rubrique Jumelages ${gammeType} en cours de configuration.
                    </div>
                </div>

                <div class="text-center">
                    <button onclick="history.back()" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition tracking-wider uppercase text-xs shadow-lg shadow-red-950/50">
                        Retour à l'accueil
                    </button>
                </div>
            `;
        } else {
            contentContainer.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <button onclick="redirigerVers('taille')" class="p-5 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex flex-col items-center text-center transition group">
                        <div class="w-12 h-12 rounded-xl bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition mb-3">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke-width="2"/></svg>
                        </div>
                        <span class="font-brand text-base font-bold tracking-wider text-white group-hover:text-red-500 transition">Par taille de jantes</span>
                        <span class="text-[11px] text-gray-400 mt-1">Recherche directe par dimensions de jante</span>
                    </button>

                    <button onclick="redirigerVers('pneu')" class="p-5 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex flex-col items-center text-center transition group">
                        <div class="w-12 h-12 rounded-xl bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition mb-3">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/></svg>
                        </div>
                        <span class="font-brand text-base font-bold tracking-wider text-white group-hover:text-red-500 transition">Par taille de pneus</span>
                        <span class="text-[11px] text-gray-400 mt-1">Recherche indicative par dimension de pneu</span>
                    </button>
                </div>

                <div class="p-3.5 bg-amber-950/30 border border-amber-900/40 rounded-xl flex items-start space-x-3 text-amber-300 text-xs leading-relaxed">
                    <svg class="w-5 h-5 text-amber-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    <div>
                        <strong class="font-semibold block mb-0.5 text-amber-200">Avertissement important :</strong>
                        La recherche par taille de pneus est fournie à titre purement indicatif. Il est impératif de vérifier la correspondance et la faisabilité auprès des données techniques du manufacturier avant toute commande.
                    </div>
                </div>
            `;
        }

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
            }
        }

        function redirigerVers(mode) {
            if (mode === 'taille') {
                window.location.href = `jumelages-jantes-taille.html?type=${gammeType}`;
            } else if (mode === 'pneu') {
                window.location.href = `jumelages-jantes-pneu.html?type=${gammeType}`;
            }
        }

        init();
    </script>
</body>
</html>
