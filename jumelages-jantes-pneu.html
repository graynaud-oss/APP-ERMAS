<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Recherche Jumelages par taille de pneu</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon.png">
    <link rel="icon" type="image/x-icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script><script type="module" src="./js/home-navigation.js"></script>
</head>
<body class="antialiased">
<div class="app-shell catalog-page results-page">
<header class="app-header"><div class="app-container app-header__inner"><a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a><button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button></div></header>
    <main class="catalog-page__body"><div class="app-container"><section class="app-page-panel results-page__panel">
            <div class="app-page-header">
                <div>
                    <p id="page-eyebrow" class="app-page-eyebrow">Catalogue Jumelages</p>
                    <h1 id="page-title" class="app-page-title">Recherche par taille de pneu</h1>
                    <p class="app-page-subtitle">Sélectionnez les dimensions du pneu étape par étape</p>
                </div>
                <button onclick="retourJumelages()" class="app-back-button">Retour</button>
            </div>

            <!-- ÉTAPE 1 : LARGEUR PNEU -->
            <div id="tire-search-panel" class="results-search-panel">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">1. Largeur de pneu</label>
                <select id="select-largeur-pneu" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Chargement des données...</option>
                </select>
            </div>

            <!-- ÉTAPE 2 : RAPPORT HAUTEUR -->
            <div id="rapport-field">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">2. Rapport / Hauteur</label>
                <select id="select-rapport" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord une largeur de pneu</option>
                </select>
            </div>

            <!-- ÉTAPE 3 : DIAMÈTRE PNEU -->
            <div>
                <label id="diametre-label" class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">3. Diamètre pneu</label>
                <select id="select-diametre-pneu" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord un rapport</option>
                </select>
            </div>
            </div>

            <!-- RÉSULTATS CORRESPONDANTS -->
            <div id="results-container" class="results-section hidden">
                <div class="results-section__header">
                    <h2 class="results-section__title">Produit correspondant</h2>
                    <label id="net-price-control" class="net-price-toggle" for="net-price-toggle">
                        <span class="net-price-toggle__label">Prix NET</span>
                        <input id="net-price-toggle" class="net-price-toggle__input" type="checkbox" aria-label="Afficher ou masquer les prix NET">
                        <span class="net-price-toggle__track" aria-hidden="true"></span>
                        <span id="net-price-status" class="net-price-toggle__status">OFF</span>
                    </label>
                </div>
                <div id="results-content" class="results-content">
                    <!-- Injecté dynamiquement -->
                </div>
            </div>
    </section></div></main>
    <footer class="app-footer">
        <div class="app-container app-footer__inner">
            <p>&copy; 2026 ERMAS - Tous droits réservés.</p>
            <nav class="app-footer__links" aria-label="Liens juridiques">
                <a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a>
                <a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>
            </nav>
        </div>
    </footer>
</div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';
        import { isNetPriceVisible, setNetPriceVisible } from './js/net-price-visibility.js';
        import { escapeHtml } from './js/safe-dom.js';
        import {
            filterTiresByAvailableCatalogDimensions,
            findCatalogProductsForTires,
            getEncodedJumelagesType,
            getJumelagesCatalogUrl,
            isAllowedJumelagesType,
            isTgdJumelagesType,
            JUMELAGES_TIRE_CSV_URL,
            parseTgdCatalogCsv
        } from './js/jumelages-catalog.js';

        const supabaseClient = getSupabaseClient();

        let pneuData = [];
        let tarifsData = [];
        let userRemise = 0;
        let gammeType = null;
        let backDestination = 'jumelages.html';
        let pageAuthorized = false;
        let netPriceVisible = isNetPriceVisible();
        let selectedWidthHasRapports = true;
        let simplifiedCatalog = false;

        window.retourJumelages = function() {
            window.location.href = backDestination;
        };

        const selLargeurPneu = document.getElementById('select-largeur-pneu');
        const selRapport = document.getElementById('select-rapport');
        const selDiametrePneu = document.getElementById('select-diametre-pneu');
        const rapportField = document.getElementById('rapport-field');
        const diametreLabel = document.getElementById('diametre-label');
        const tireSearchPanel = document.getElementById('tire-search-panel');
        const resultsContainer = document.getElementById('results-container');
        const resultsContent = document.getElementById('results-content');
        const netPriceToggle = document.getElementById('net-price-toggle');
        const netPriceStatus = document.getElementById('net-price-status');
        const netPriceControl = document.getElementById('net-price-control');

        function updateNetPriceVisibility() {
            netPriceToggle.checked = netPriceVisible;
            netPriceStatus.textContent = netPriceVisible ? 'ON' : 'OFF';
            document.querySelectorAll('[data-net-price]').forEach((element) => {
                element.hidden = !netPriceVisible;
            });
            netPriceControl.classList.toggle('hidden', !resultsContent.querySelector('[data-net-price]'));
        }

        async function initPage() {
            let context;
            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            if (context.profile && context.profile.remise) {
                userRemise = parseFloat(context.profile.remise) || 0;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const requestedType = urlParams.get('type');
            if (!isAllowedJumelagesType(requestedType)) {
                window.location.href = 'jumelages.html';
                return;
            }
            gammeType = requestedType;
            simplifiedCatalog = isTgdJumelagesType(gammeType);
            backDestination = `jumelages-choix.html?type=${getEncodedJumelagesType(gammeType)}`;
            document.getElementById('page-eyebrow').textContent = `Catalogue Jumelages — ${gammeType}`;
            document.getElementById('page-title').textContent = 'Recherche par taille de pneu';
            netPriceToggle.addEventListener('change', () => {
                netPriceVisible = netPriceToggle.checked;
                netPriceVisible = setNetPriceVisible(netPriceToggle.checked);
                updateNetPriceVisibility();
            });
            updateNetPriceVisibility();
            pageAuthorized = true;

            try {
                const [pneuRes, tarifsRes] = await Promise.all([
                    fetch(JUMELAGES_TIRE_CSV_URL),
                    fetch(getJumelagesCatalogUrl(gammeType))
                ]);

                if (!pneuRes.ok || !tarifsRes.ok) {
                    throw new Error('Catalogues Jumelages indisponibles');
                }

                const pneuText = await pneuRes.text();
                const tarifsText = await tarifsRes.text();

                parsePneuCSV(pneuText);
                parseTarifsCSV(tarifsText);
                
                filtrerPneusDisponibles();
                populateLargeursPneu();
                restaurerSelections();
            } catch (err) {
                selLargeurPneu.innerHTML = '<option value="">Erreur de chargement des données</option>';
            }
        }

        function parsePneuCSV(text) {
            const lines = text.split('\n');
            pneuData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 4) {
                    pneuData.push({
                        largeurPneu: cols[0] || '',
                        rapport: cols[1] || '',
                        diametrePneu: cols[2] || '',
                        largeurJante: cols[3] || ''
                    });
                }
            }
        }

        function parseTarifsCSV(text) {
            if (simplifiedCatalog) {
                tarifsData = parseTgdCatalogCsv(text);
                return;
            }
            const lines = text.split('\n');
            tarifsData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 7) {
                    tarifsData.push({
                        largeurJante: cols[0] || '',
                        diametre: cols[1] || '',
                        colC: cols[2] || '', // Hors Tout
                        colD: cols[3] || '', // Emboitement
                        nom: cols[4] || '',
                        tendeurs: cols[5] || '',
                        prix: cols[6] || '',
                        kitSansJantes: cols[7] || '',
                        joncs: cols[8] || '',
                        paireTendeurs: cols[9] || '',
                        entretoises: cols[10] || ''
                    });
                }
            }
        }

        let filteredPneuData = [];
        function filtrerPneusDisponibles() {
            filteredPneuData = filterTiresByAvailableCatalogDimensions(pneuData, tarifsData);
        }

        function populateLargeursPneu() {
            const largeurs = [...new Set(filteredPneuData.map(item => item.largeurPneu))].filter(Boolean);
            largeurs.sort((a, b) => parseFloat(a) - parseFloat(b));

            selLargeurPneu.innerHTML = '<option value="">-- Sélectionnez une largeur de pneu --</option>';
            largeurs.forEach(l => {
                selLargeurPneu.innerHTML += `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`;
            });
            selLargeurPneu.disabled = false;
        }

        function sauvegarderSelections() {
            sessionStorage.setItem('ermas_pneu_largeur', selLargeurPneu.value);
            sessionStorage.setItem('ermas_pneu_rapport', selRapport.value);
            sessionStorage.setItem('ermas_pneu_diametre', selDiametrePneu.value);
        }

        function restaurerSelections() {
            const savedL = sessionStorage.getItem('ermas_pneu_largeur');
            const savedR = sessionStorage.getItem('ermas_pneu_rapport');
            const savedD = sessionStorage.getItem('ermas_pneu_diametre');

            if (savedL && [...selLargeurPneu.options].some(o => o.value === savedL)) {
                selLargeurPneu.value = savedL;
                selLargeurPneu.dispatchEvent(new Event('change'));

                if (savedR && [...selRapport.options].some(o => o.value === savedR)) {
                    selRapport.value = savedR;
                    selRapport.dispatchEvent(new Event('change'));

                    if (savedD && [...selDiametrePneu.options].some(o => o.value === savedD)) {
                        selDiametrePneu.value = savedD;
                        selDiametrePneu.dispatchEvent(new Event('change'));
                    }
                } else if (!selectedWidthHasRapports && savedD && [...selDiametrePneu.options].some(o => o.value === savedD)) {
                    selDiametrePneu.value = savedD;
                    selDiametrePneu.dispatchEvent(new Event('change'));
                }
            }
        }

        selLargeurPneu.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenL = selLargeurPneu.value;
            selRapport.innerHTML = '<option value="">-- Sélectionnez un rapport --</option>';
            selDiametrePneu.innerHTML = '<option value="">Sélectionnez d\'abord un rapport</option>';
            selRapport.disabled = true;
            selDiametrePneu.disabled = true;
            rapportField.classList.remove('hidden');
            tireSearchPanel.classList.remove('results-search-panel--two-columns');
            diametreLabel.textContent = '3. Diamètre pneu';
            selectedWidthHasRapports = true;
            resultsContainer.classList.add('hidden');
            sauvegarderSelections();

            if (!chosenL) return;

            const filtered = filteredPneuData.filter(item => item.largeurPneu === chosenL);
            const rapports = [...new Set(filtered.map(item => item.rapport))].filter(Boolean);
            rapports.sort((a, b) => parseFloat(a) - parseFloat(b));

            if (rapports.length === 0) {
                selectedWidthHasRapports = false;
                rapportField.classList.add('hidden');
                tireSearchPanel.classList.add('results-search-panel--two-columns');
                diametreLabel.textContent = '2. Diamètre pneu';
                selDiametrePneu.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
                const diametres = [...new Set(filtered.map(item => item.diametrePneu))].filter(Boolean);
                diametres.sort((a, b) => parseFloat(a) - parseFloat(b));
                diametres.forEach(d => {
                    selDiametrePneu.innerHTML += `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`;
                });
                selDiametrePneu.disabled = false;
                sauvegarderSelections();
                return;
            }

            rapports.forEach(r => {
                selRapport.innerHTML += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`;
            });
            selRapport.disabled = false;
        });

        selRapport.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenL = selLargeurPneu.value;
            const chosenR = selRapport.value;
            selDiametrePneu.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
            selDiametrePneu.disabled = true;
            resultsContainer.classList.add('hidden');
            sauvegarderSelections();

            if (!chosenR) return;

            const filtered = filteredPneuData.filter(item => item.largeurPneu === chosenL && item.rapport === chosenR);
            const diametres = [...new Set(filtered.map(item => item.diametrePneu))].filter(Boolean);
            diametres.sort((a, b) => parseFloat(a) - parseFloat(b));

            diametres.forEach(d => {
                selDiametrePneu.innerHTML += `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`;
            });
            selDiametrePneu.disabled = false;
        });

        selDiametrePneu.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenL = selLargeurPneu.value;
            const chosenR = selRapport.value;
            const chosenD = selDiametrePneu.value;
            sauvegarderSelections();

            if (!chosenD) {
                resultsContainer.classList.add('hidden');
                return;
            }

            const matchingPneus = filteredPneuData.filter(item => 
                item.largeurPneu === chosenL && 
                (!selectedWidthHasRapports || item.rapport === chosenR) &&
                item.diametrePneu === chosenD
            );

            if (matchingPneus.length === 0) {
                resultsContainer.classList.add('hidden');
                return;
            }

            let finalMatchedTarifs;
            if (simplifiedCatalog) {
                finalMatchedTarifs = findCatalogProductsForTires(matchingPneus, tarifsData);
            } else {
                const uniqueLargeursJantes = [...new Set(matchingPneus.map(item => item.largeurJante))].filter(Boolean);
                let allMatchedTarifs = [];
                uniqueLargeursJantes.forEach(targetLargeurJante => {
                    const matchedTarifs = tarifsData.filter(t =>
                        t.largeurJante.toLowerCase() === targetLargeurJante.toLowerCase()
                        && t.diametre.toLowerCase() === chosenD.toLowerCase()
                    );
                    allMatchedTarifs.push(...matchedTarifs);
                });
                const uniqueTarifsMap = new Map();
                allMatchedTarifs.forEach(match => {
                    const uniqueKey = `${(match.nom || '').trim().toLowerCase()}_${(match.tendeurs || '').trim().toLowerCase()}`;
                    if (!uniqueTarifsMap.has(uniqueKey)) uniqueTarifsMap.set(uniqueKey, match);
                });
                finalMatchedTarifs = Array.from(uniqueTarifsMap.values());
            }

            let html = '';

            finalMatchedTarifs.forEach(match => {
                let nomComplet = match.nom || 'N/A';
                if (match.tendeurs && match.tendeurs.trim() !== '') {
                    nomComplet += ` - ${match.tendeurs} TENDEURS`;
                }

                const productPayload = encodeURIComponent(JSON.stringify({
                    nom: match.nom,
                    tendeurs: match.tendeurs,
                    colC: match.colC,
                    colD: match.colD
                }));

                html += `
                    <div class="bg-[#070913] border border-gray-800 p-4 rounded-xl space-y-4 mb-3">
                        <div>
                            <div class="text-white text-base font-bold tracking-wide mt-0.5">${escapeHtml(nomComplet)}</div>
                        </div>
                `;

                // TARIF PRINCIPAL (G) avec séparation nette et prix catalogue inchangé
                if (match.prix && !isNaN(parseFloat(match.prix))) {
                    const basePrix = parseFloat(match.prix);
                    const finalPrix = userRemise > 0 ? basePrix * (1 - userRemise / 100) : basePrix;

                    html += `
                        <div class="results-price-block">
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1">Tarif Principal</span>
                    `;

                    if (userRemise > 0) {
                        html += `
                            <div class="text-xs text-gray-400 pb-2 border-b border-gray-800/60 flex justify-between items-center">
                                <span>Prix BRUT :</span>
                                <span class="text-white font-medium">${basePrix.toFixed(2)} €</span>
                            </div>
                            <div data-net-price ${netPriceVisible ? '' : 'hidden'} class="results-price-block__net flex justify-between items-center pt-2">
                                <span class="text-xs uppercase tracking-wider text-red-400 font-semibold">Prix NET</span>
                                <span class="text-white font-extrabold text-lg">${finalPrix.toFixed(2)} €</span>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="flex justify-between items-center pt-1">
                                <span class="text-xs uppercase tracking-wider text-gray-400">Prix BRUT</span>
                                <span class="text-white font-extrabold text-lg">${finalPrix.toFixed(2)} €</span>
                            </div>
                        `;
                    }
                    html += `</div>`;
                } else {
                    html += `
                        <div class="bg-gray-900/50 p-3.5 rounded-lg border border-gray-800 flex justify-between items-center">
                            <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Tarif Principal</span>
                            <span class="text-gray-500 text-xs italic">Sur consultation</span>
                        </div>
                    `;
                }

                // Les options et calculateurs concernent uniquement EVO / 360.
                if (!simplifiedCatalog) {
                    html += `
                    <div class="pt-2 border-t border-gray-800/80">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold mb-2">Options / Suppléments</span>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                `;

                const options = [
                    { label: 'Kit sans jantes', val: match.kitSansJantes },
                    { label: 'Suppl. joncs à boulonner', val: match.joncs },
                    { label: 'Paire tendeurs supp.', val: match.paireTendeurs },
                    { label: 'Suppl. entretoises étagées', val: match.entretoises }
                ];

                options.forEach(opt => {
                    if (opt.val && !isNaN(parseFloat(opt.val))) {
                        const baseOpt = parseFloat(opt.val);
                        const finalOpt = userRemise > 0 ? baseOpt * (1 - userRemise / 100) : baseOpt;

                        html += `
                            <div class="results-option-block flex flex-col justify-between text-xs">
                                <span class="text-gray-400 text-[11px] mb-1">${opt.label}</span>
                        `;

                        if (userRemise > 0) {
                            html += `
                                <div class="text-[10px] text-gray-400 pb-1 border-b border-gray-800/40 flex justify-between items-center">
                                    <span>Prix BRUT :</span>
                                    <span class="text-white">${baseOpt.toFixed(2)} €</span>
                                </div>
                                <div data-net-price ${netPriceVisible ? '' : 'hidden'} class="results-price-block__net flex justify-between items-center pt-1 font-medium">
                                    <span class="text-red-400 text-[10px]">Prix NET :</span>
                                    <span class="text-gray-200">${finalOpt.toFixed(2)} €</span>
                                </div>
                            `;
                        } else {
                            html += `
                                <div class="flex justify-between items-center pt-1">
                                    <span class="text-gray-500 text-[10px]">Prix BRUT :</span>
                                    <span class="text-gray-200 font-medium">${finalOpt.toFixed(2)} €</span>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    } else {
                        html += `
                            <div class="results-option-block flex justify-between items-center text-xs">
                                <span class="text-gray-400 text-[11px]">${opt.label}</span>
                                <span class="text-gray-500 italic">N/C</span>
                            </div>
                        `;
                    }
                });

                    html += `
                        </div>
                    </div>

                    <!-- BOUTON CALCULATEUR HORS TOUT -->
                    <div class="pt-2">
                        <button onclick='ouvrirCalculHorsTout("${productPayload}")' class="w-full bg-red-600 hover:bg-red-500 text-white font-brand uppercase tracking-wider text-xs font-bold py-2.5 rounded-lg transition shadow-md shadow-red-900/20">
                            Calculer Largeur Hors Tout
                        </button>
                    </div>
                </div>`;
                } else {
                    html += `</div>`;
                }
            });

            if (!html) {
                resultsContent.innerHTML = `<div class="p-4 bg-gray-900/50 border border-gray-800 text-gray-400 text-xs rounded-xl text-center">Aucune jante tarifée trouvée pour cette dimension de pneu.</div>`;
            } else {
                resultsContent.innerHTML = html;
            }

            resultsContainer.classList.remove('hidden');
            updateNetPriceVisibility();
        });

        function ouvrirCalculHorsTout(payloadEncoded) {
            if (!pageAuthorized || simplifiedCatalog) return;

            const productData = JSON.parse(decodeURIComponent(payloadEncoded));
            sessionStorage.setItem('ermas_hors_tout_product', JSON.stringify(productData));
            window.location.href = `calcul-hors-tout.html?type=${gammeType}&source=pneu`;
        }

        window.ouvrirCalculHorsTout = ouvrirCalculHorsTout;

        initPage().catch(() => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
