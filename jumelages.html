<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Catalogue Jumelages</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">
    <div id="jumelages-view" class="hidden h-full flex flex-col justify-between w-full">
        <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
            <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 class="font-brand text-xl sm:text-2xl font-bold text-white">Catalogue Jumelages</h2>
                        <p class="text-xs text-gray-400 mt-0.5">Sélectionnez le type de gamme :</p>
                    </div>
                    <button type="button" data-protected-route="accueil.html" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                    <button type="button" data-protected-route="jumelages-choix.html?type=EVO" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex flex-col items-center text-center transition group">
                        <span class="font-brand text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition">EVO</span>
                        <span class="text-xs text-red-400 font-semibold mt-1">300 à 500 cv</span>
                    </button>

                    <button type="button" data-protected-route="jumelages-choix.html?type=360" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex flex-col items-center text-center transition group">
                        <span class="font-brand text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition">360</span>
                        <span class="text-xs text-red-400 font-semibold mt-1">80 à 320 cv</span>
                    </button>

                    <button type="button" data-protected-route="jumelages-information.html?type=TGD" data-gamme="TGD" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex flex-col items-center text-center transition group">
                        <span class="font-brand text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition">TGD</span>
                        <span class="text-xs text-red-400 font-semibold mt-1">120 à 250 cv</span>
                    </button>

                    <button type="button" data-protected-route="jumelages-information.html?type=TGD%2B" data-gamme="TGD+" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex flex-col items-center text-center transition group">
                        <span class="font-brand text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition">TGD+</span>
                        <span class="text-xs text-red-400 font-semibold mt-1">160 à 400 cv</span>
                    </button>
                </div>

                <div class="pt-4 border-t border-gray-800 text-center">
                    <button type="button" data-protected-route="documents.html" class="text-xs text-red-400 hover:text-red-300 font-semibold transition uppercase tracking-wider">
                        Consulter les fiches produits &amp; documentations techniques &rarr;
                    </button>
                </div>
            </div>
        </div>

        <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
            &copy; 2026 ERMAS - Tous droits réservés.
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const supabaseClient = getSupabaseClient();
        const jumelagesView = document.getElementById('jumelages-view');
        let pageAuthorized = false;

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            jumelagesView.classList.remove('hidden');
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
