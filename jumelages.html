<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Catalogue Jumelages</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script><script type="module" src="./js/home-navigation.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="jumelages-view" class="hidden app-shell catalog-page">
<header class="app-header"><div class="app-container app-header__inner"><a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a><button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button></div></header>
        <main class="catalog-page__body"><div class="app-container"><section class="app-page-panel" aria-labelledby="jumelages-title">
                <div class="app-page-header">
                    <div>
                        <p class="app-page-eyebrow">Solutions de jumelage</p>
                        <h1 id="jumelages-title" class="app-page-title">Catalogue Jumelages</h1>
                        <p class="app-page-subtitle">Sélectionnez le type de gamme :</p>
                    </div>
                    <button type="button" data-protected-route="accueil.html" class="app-back-button">Retour</button>
                </div>

                <div class="app-choice-grid">
                    <button type="button" data-protected-route="jumelages-choix.html?type=EVO" class="app-choice-card app-choice-card--range">
                        <span class="app-choice-card__title">EVO</span>
                        <span class="app-technical-meta">300 à 500 cv</span>
                    </button>

                    <button type="button" data-protected-route="jumelages-choix.html?type=360" class="app-choice-card app-choice-card--range">
                        <span class="app-choice-card__title">360</span>
                        <span class="app-technical-meta">80 à 320 cv</span>
                    </button>

                    <button type="button" data-protected-route="jumelages-choix.html?type=TGD" data-gamme="TGD" class="app-choice-card app-choice-card--range">
                        <span class="app-choice-card__title">TGD</span>
                        <span class="app-technical-meta">120 à 250 cv</span>
                    </button>

                    <button type="button" data-protected-route="jumelages-choix.html?type=TGD%2B" data-gamme="TGD+" class="app-choice-card app-choice-card--range">
                        <span class="app-choice-card__title">TGD+</span>
                        <span class="app-technical-meta">160 à 400 cv</span>
                    </button>
                </div>

                <div class="app-resource-row">
                    <button type="button" data-protected-route="documents.html" class="app-resource-link">
                        Consulter les fiches produits &amp; documentations techniques &rarr;
                    </button>
                </div>
        </section></div></main>

        <footer class="app-footer">
            <div class="app-container app-footer__inner">
                <p>&copy; 2026 ERMAS - Tous droits réservés.</p>
                <nav class="app-footer__links" aria-label="Informations juridiques">
                    <a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a>
                    <span aria-hidden="true">|</span>
                    <a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>
                </nav>
            </div>
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const supabaseClient = getSupabaseClient();
        const jumelagesView = document.getElementById('jumelages-view');
        let pageAuthorized = false;

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            jumelagesView.classList.remove('hidden');
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
