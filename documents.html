<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Documents Techniques</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script><script type="module" src="./js/home-navigation.js"></script>
</head>
<body>
    <div id="documents-view" class="hidden app-shell catalog-page documents-page">
        <header class="app-header">
            <div class="app-container app-header__inner">
                <a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a>
                <button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button>
            </div>
        </header>

        <main class="catalog-page__body">
            <div class="app-container">
            <section class="app-page-panel documents-panel" aria-labelledby="documents-title">
                <div class="app-page-header">
                    <div>
                        <p class="app-page-eyebrow">Ressources techniques</p>
                        <h1 id="documents-title" class="app-page-title">Documents Techniques</h1>
                        <p class="app-page-subtitle">Fiches techniques et documentations officielles en libre téléchargement.</p>
                    </div>
                    <button type="button" data-protected-route="accueil.html" class="app-back-button">Retour</button>
                </div>

                <div id="documents-list" class="documents-list" aria-live="polite">
                    <div class="documents-status">Chargement des documents...</div>
                </div>
            </section>
            </div>
        </main>

        <footer class="app-footer">
            <div class="app-container app-footer__inner">
                <p>&copy; 2026 ERMAS - Tous droits réservés.</p>
                <nav class="app-footer__links" aria-label="Informations juridiques">
                    <a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a>
                    <span aria-hidden="true">|</span>
                    <a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>
                </nav>
            </div>
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const DOCUMENTS_BUCKET = 'doc-app-ermas';
        const supabaseClient = getSupabaseClient();
        const documentsView = document.getElementById('documents-view');
        let pageAuthorized = false;

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            documentsView.classList.remove('hidden');
            await loadDocumentsFromStorage();
        }

        async function loadDocumentsFromStorage() {
            const container = document.getElementById('documents-list');
            container.innerHTML = '<div class="text-center py-8 text-gray-500 text-xs uppercase tracking-wider">Actualisation des documents...</div>';

            const { data, error } = await supabaseClient.storage
                .from(DOCUMENTS_BUCKET)
                .list('', {
                    limit: 100,
                    sortBy: { column: 'name', order: 'asc' }
                });

            if (error) {
                const errorPanel = document.createElement('div');
                errorPanel.className = 'p-4 bg-red-950/40 border border-red-900/40 text-red-400 text-xs rounded-xl text-center';
                errorPanel.textContent = `Erreur lors du chargement : ${error.message}`;
                container.replaceChildren(errorPanel);
                return;
            }

            const files = data ? data.filter(file => file.name && file.name.toLowerCase().endsWith('.pdf')) : [];

            if (files.length === 0) {
                container.innerHTML = '<div class="p-8 text-center bg-[#070913] border border-gray-800 rounded-xl text-gray-500 text-xs uppercase tracking-wider">Aucun document disponible pour le moment.</div>';
                return;
            }

            const documentItems = document.createDocumentFragment();
            for (const file of files) {
                const { data: publicUrlData } = supabaseClient.storage
                    .from(DOCUMENTS_BUCKET)
                    .getPublicUrl(file.name);

                const fileUrl = publicUrlData.publicUrl;
                const cleanName = file.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, " ");

                const item = document.createElement('div');
                item.className = 'bg-[#070913] border border-gray-800 p-4 rounded-xl flex items-center justify-between hover:border-gray-700 transition group';

                const identity = document.createElement('div');
                identity.className = 'flex items-center space-x-3.5 overflow-hidden';
                const icon = document.createElement('div');
                icon.className = 'w-10 h-10 rounded-lg bg-red-950/30 border border-red-900/40 flex items-center justify-center text-red-500 shrink-0';
                icon.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>';

                const labels = document.createElement('div');
                labels.className = 'truncate';
                const title = document.createElement('h4');
                title.className = 'text-white text-sm font-medium uppercase tracking-wide truncate group-hover:text-red-400 transition';
                title.textContent = cleanName;
                const format = document.createElement('span');
                format.className = 'text-[10px] text-gray-500 uppercase tracking-widest';
                format.textContent = 'Format PDF';
                labels.append(title, format);
                identity.append(icon, labels);

                const actions = document.createElement('div');
                actions.className = 'flex items-center space-x-2 shrink-0 ml-4';
                const viewLink = document.createElement('a');
                viewLink.href = fileUrl;
                viewLink.target = '_blank';
                viewLink.rel = 'noopener noreferrer';
                viewLink.className = 'px-3 py-2 bg-gray-900 hover:bg-gray-800 text-gray-300 hover:text-white border border-gray-800 text-xs font-semibold rounded-lg transition';
                viewLink.textContent = 'Voir';

                const downloadLink = document.createElement('a');
                downloadLink.href = fileUrl;
                downloadLink.download = '';
                downloadLink.className = 'px-3 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-lg transition shadow-lg shadow-red-950/50 flex items-center space-x-1.5';
                downloadLink.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg><span>Télécharger</span>';
                actions.append(viewLink, downloadLink);

                item.append(identity, actions);
                documentItems.append(item);
            }

            container.replaceChildren(documentItems);
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
