<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Plateforme Technique</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">
    <div id="app-view" class="hidden h-full flex flex-col justify-between w-full">
        <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
            <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl text-center">
                <img src="https://lh3.googleusercontent.com/d/1w2dpsmjryA7CDj4GTeHww4stdl5bE8fR" alt="ERMAS Logo" class="h-10 w-auto mx-auto mb-4 object-contain">
                <h2 class="font-brand text-xl sm:text-2xl font-bold text-white mb-2">Bienvenue sur notre espace technique réservé aux revendeurs</h2>
                <p class="text-gray-400 text-xs sm:text-sm mb-6">Sélectionnez une rubrique ci-dessous :</p>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                    <button type="button" data-protected-route="jantes.html" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex items-center space-x-4 transition group">
                        <div class="w-10 h-10 rounded-lg bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke-width="2"/><path stroke-width="2" d="M12 3v6m0 6v6M3 12h6m6 0h6"/></svg>
                        </div>
                        <span class="font-brand text-base sm:text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition text-left">JANTES</span>
                    </button>

                    <button type="button" data-protected-route="jumelages.html" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex items-center space-x-4 transition group">
                        <div class="w-10 h-10 rounded-lg bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6" stroke-width="2"/><circle cx="15" cy="12" r="6" stroke-width="2"/></svg>
                        </div>
                        <span class="font-brand text-base sm:text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition text-left">JUMELAGES</span>
                    </button>

                    <button type="button" data-protected-route="roues-etroites.html" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex items-center space-x-4 transition group">
                        <div class="w-10 h-10 rounded-lg bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path stroke-width="2" d="M12 3v18"/></svg>
                        </div>
                        <span class="font-brand text-base sm:text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition text-left">ROUES ETROITES</span>
                    </button>

                    <button type="button" data-protected-route="documents.html" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex items-center space-x-4 transition group">
                        <div class="w-10 h-10 rounded-lg bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        </div>
                        <span class="font-brand text-base sm:text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition text-left">DOCUMENTS</span>
                    </button>

                    <button type="button" data-protected-route="contact.html" class="p-4 bg-[#070913] hover:bg-red-950/30 border border-gray-800 hover:border-red-600/50 rounded-xl flex items-center space-x-4 transition group sm:col-span-2">
                        <div class="w-10 h-10 rounded-lg bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-400 group-hover:text-red-500 group-hover:border-red-600/50 transition shrink-0">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                        </div>
                        <span class="font-brand text-base sm:text-lg font-bold tracking-wider text-white group-hover:text-red-500 transition text-left">NOUS CONTACTER</span>
                    </button>
                </div>
            </div>
        </div>

        <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
            &copy; 2026 ERMAS - Tous droits réservés.
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const supabaseClient = getSupabaseClient();
        const appView = document.getElementById('app-view');
        let pageAuthorized = false;

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            appView.classList.remove('hidden');
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
