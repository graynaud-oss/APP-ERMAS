<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Plateforme Technique</title>
    <link rel="icon" type="image/png" sizes="96x96" href="./assets/brand/favicon.png">
    <link rel="icon" type="image/x-icon" href="./assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="./assets/brand/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="./css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script>
</head>
<body>
    <div id="app-view" class="hidden app-shell">
        <header class="app-header">
            <div class="app-container app-header__inner">
                <a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img src="./assets/brand/ermas-logo.png" alt="" class="app-logo" width="525" height="123"></a>
                <button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button>
            </div>
        </header>

        <main class="app-main">
            <div class="app-container">
                <section class="home-introduction" aria-labelledby="home-title">
                    <p class="home-eyebrow">Plateforme technique</p>
                    <h1 id="home-title" class="home-title">Bienvenue sur notre espace technique réservé aux revendeurs</h1>
                    <p class="home-lead">Sélectionnez une rubrique ci-dessous :</p>
                </section>

                <section class="home-section" aria-labelledby="home-catalogues-title">
                    <h2 id="home-catalogues-title" class="home-section__title">Catalogues techniques</h2>
                    <div class="home-primary-grid">
                        <button type="button" data-protected-route="jantes.html" class="nav-card">
                            <span class="nav-card__icon" aria-hidden="true">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><circle cx="12" cy="12" r="3" stroke-width="2"/><path stroke-width="2" d="M12 3v6m0 6v6M3 12h6m6 0h6"/></svg>
                            </span>
                            <span class="nav-card__footer">
                                <span class="nav-card__title">JANTES</span>
                                <span class="nav-card__arrow" aria-hidden="true">→</span>
                            </span>
                        </button>

                        <button type="button" data-protected-route="jumelages.html" class="nav-card">
                            <span class="nav-card__icon" aria-hidden="true">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6" stroke-width="2"/><circle cx="15" cy="12" r="6" stroke-width="2"/></svg>
                            </span>
                            <span class="nav-card__footer">
                                <span class="nav-card__title">JUMELAGES</span>
                                <span class="nav-card__arrow" aria-hidden="true">→</span>
                            </span>
                        </button>

                        <button type="button" data-protected-route="roues-etroites.html" class="nav-card">
                            <span class="nav-card__icon" aria-hidden="true">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path stroke-width="2" d="M12 3v18"/></svg>
                            </span>
                            <span class="nav-card__footer">
                                <span class="nav-card__title">ROUES ETROITES</span>
                                <span class="nav-card__arrow" aria-hidden="true">→</span>
                            </span>
                        </button>
                    </div>
                </section>

                <section class="home-section" aria-labelledby="home-resources-title">
                    <h2 id="home-resources-title" class="home-section__title">Ressources et assistance</h2>
                    <div class="home-secondary-grid">
                        <button type="button" data-protected-route="documents.html" class="nav-card nav-card--secondary">
                            <span class="nav-card__icon" aria-hidden="true">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            </span>
                            <span class="nav-card__title">DOCUMENTS</span>
                            <span class="nav-card__arrow" aria-hidden="true">→</span>
                        </button>

                        <button type="button" data-protected-route="contact.html" class="nav-card nav-card--secondary">
                            <span class="nav-card__icon" aria-hidden="true">
                                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                            </span>
                            <span class="nav-card__title">NOUS CONTACTER</span>
                            <span class="nav-card__arrow" aria-hidden="true">→</span>
                        </button>
                    </div>
                </section>
            </div>
        </main>

        <footer class="app-footer">
            <div class="app-container app-footer__inner">
                <p>&copy; 2026 ERMAS - Tous droits réservés.</p>
                <nav class="app-footer__links" aria-label="Informations juridiques">
                    <a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a>
                    <span aria-hidden="true">|</span>
                    <a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>
                </nav>
            </div>
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const supabaseClient = getSupabaseClient();
        const appView = document.getElementById('app-view');
        let pageAuthorized = false;

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            appView.classList.remove('hidden');
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
