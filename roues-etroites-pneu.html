<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Recherche Roues Étroites par Taille de Pneus</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body><div class="app-shell catalog-page results-page">
<header class="app-header"><div class="app-container app-header__inner"><a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a><button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button></div></header>

    <main class="catalog-page__body"><div class="app-container"><section class="app-page-panel results-page__panel">
            <div class="app-page-header">
                <div>
                    <p class="app-page-eyebrow">Catalogue Roues Étroites</p>
                    <h1 class="app-page-title">Recherche roues étroites par taille de pneu</h1>
                    <p class="app-page-subtitle">Sélectionnez les dimensions du pneu étape par étape</p>
                </div>
                <button onclick="window.location.href = 'roues-etroites.html'" class="app-back-button">Retour</button>
            </div>

            <div id="tire-search-panel" class="results-search-panel">
            <!-- ÉTAPE 1 : LARGEUR PNEU -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">1. Largeur de pneu</label>
                <select id="select-largeur-pneu" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Chargement des données...</option>
                </select>
            </div>

            <!-- ÉTAPE 2 : RAPPORT HAUTEUR -->
            <div id="rapport-field" class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">2. Rapport / Hauteur</label>
                <select id="select-rapport" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord une largeur de pneu</option>
                </select>
            </div>

            <!-- ÉTAPE 3 : DIAMÈTRE PNEU -->
            <div class="mb-6">
                <label id="diametre-label" class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">3. Diamètre pneu</label>
                <select id="select-diametre-pneu" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord un rapport</option>
                </select>
            </div>

            <!-- RÉSULTATS CORRESPONDANTS -->
            </div>
            <div id="results-container" class="hidden results-section">
                <div class="results-section__header"><h2 class="results-section__title">Roues Étroites &amp; Tarifs correspondants :</h2><div id="net-price-control" class="net-price-control hidden"><label class="net-price-toggle" for="net-price-toggle" aria-label="Afficher ou masquer les prix NET"><span>Prix NET</span><input id="net-price-toggle" class="net-price-toggle__input" type="checkbox" disabled><span class="net-price-toggle__track" aria-hidden="true"></span><span id="net-price-toggle-state" class="net-price-toggle__state" aria-live="polite">OFF</span></label></div></div>
                <div id="results-content" class="results-content"></div>
            </div>
        </section></div></main>

    <footer class="app-footer"><div class="app-container app-footer__inner"><p>&copy; 2026 ERMAS - Tous droits réservés.</p><nav class="app-footer__links" aria-label="Informations juridiques"><a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a><span aria-hidden="true">|</span><a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a></nav></div></footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';
        import { isNetPriceVisible, setNetPriceVisible } from './js/net-price-visibility.js';
        import { escapeHtml } from './js/safe-dom.js';

        const PNEU_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=139891043&single=true&output=csv';
        const TARIFS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=21297594&single=true&output=csv';

        const supabaseClient = getSupabaseClient();

        let tarifsData = [];
        let pneuRows = [];
        let userRemise = 0;
        let netPriceVisible = false;
        let pageAuthorized = false;
        let selectedWidthHasRapports = true;

        const selLargeurPneu = document.getElementById('select-largeur-pneu');
        const selRapport = document.getElementById('select-rapport');
        const selDiametrePneu = document.getElementById('select-diametre-pneu');
        const rapportField = document.getElementById('rapport-field');
        const diametreLabel = document.getElementById('diametre-label');
        const tireSearchPanel = document.getElementById('tire-search-panel');
        const resultsContainer = document.getElementById('results-container');
        const resultsContent = document.getElementById('results-content');
        const netPriceControl = document.getElementById('net-price-control');
        const netPriceToggle = document.getElementById('net-price-toggle');
        const netPriceToggleState = document.getElementById('net-price-toggle-state');

        async function initPage() {
            let context;
            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            if (context.profile && context.profile.remise) {
                userRemise = parseFloat(context.profile.remise) || 0;
            }
            netPriceVisible = isNetPriceVisible();
            netPriceToggle.checked = netPriceVisible;
            netPriceToggle.disabled = false;
            updateNetPriceToggleState();
            netPriceToggle.addEventListener('change', () => {
                if (!pageAuthorized) return;
                netPriceVisible = setNetPriceVisible(netPriceToggle.checked);
                updateNetPriceVisibility();
            });
            pageAuthorized = true;

            try {
                const [pneuRes, tarifsRes] = await Promise.all([
                    fetch(PNEU_CSV_URL),
                    fetch(TARIFS_CSV_URL)
                ]);

                if (!pneuRes.ok || !tarifsRes.ok) {
                    throw new Error('Catalogues Roues étroites indisponibles');
                }

                const pneuText = await pneuRes.text();
                const tarifsText = await tarifsRes.text();

                parseTarifsCSV(tarifsText);
                parsePneuCSV(pneuText);
            } catch (err) {
                selLargeurPneu.innerHTML = '<option value="">Erreur de chargement des données</option>';
            }
        }

        function updateNetPriceToggleState() {
            netPriceToggleState.textContent = netPriceVisible ? 'ON' : 'OFF';
        }

        function updateNetPriceVisibility() {
            resultsContent.querySelectorAll('[data-net-price]').forEach((element) => {
                element.hidden = !netPriceVisible;
            });

            const hasNetPrice = userRemise > 0 && resultsContent.querySelector('[data-net-price]');
            netPriceControl.classList.toggle('hidden', !hasNetPrice);
            netPriceToggle.checked = netPriceVisible;
            updateNetPriceToggleState();
        }

        function parseCSVLine(line) {
            const cols = [];
            let current = '';
            let inQuotes = false;
            for (let j = 0; j < line.length; j++) {
                const char = line[j];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    cols.push(current.trim().replace(/^"|"$/g, ''));
                    current = '';
                } else {
                    current += char;
                }
            }
            cols.push(current.trim().replace(/^"|"$/g, ''));
            return cols;
        }

        function parseTarifsCSV(text) {
            const lines = text.split('\n');
            tarifsData = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = parseCSVLine(line);
                
                if (cols.length >= 7) {
                    tarifsData.push({
                        largeurJante: cols[0], // Col A
                        diametre:     cols[1], // Col B
                        horsTout:     cols[2], // Col C
                        emboitement:  cols[3], // Col D
                        profil:       cols[4], // Col E
                        nom:          cols[5], // Col F
                        prixVV:       cols[6], // Col G (Prix roue étroite)
                        deportMaxI:   cols[8] || '',
                        deportMinJ:   cols[9] || ''
                    });
                }
            }
        }

        function normalizeStr(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/\.0$/, '').replace(/\s+/g, '').trim();
        }

        function parsePneuCSV(text) {
            const lines = text.split('\n');
            pneuRows = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const cols = parseCSVLine(line);
                
                if (cols.length >= 4) {
                    const largeurPneu  = cols[0];
                    const rapport      = cols[1];
                    const diametrePneu = cols[2];
                    const largeurJante = cols[3];

                    const correspondanceExiste = tarifsData.some(t => 
                        normalizeStr(t.largeurJante) === normalizeStr(largeurJante) && 
                        normalizeStr(t.diametre) === normalizeStr(diametrePneu)
                    );

                    if (correspondanceExiste) {
                        pneuRows.push({
                            largeurPneu,
                            rapport,
                            diametrePneu,
                            largeurJante
                        });
                    }
                }
            }
            populateLargeursPneu();
        }

        function populateLargeursPneu() {
            const largeurs = [...new Set(pneuRows.map(item => item.largeurPneu))].filter(Boolean);
            largeurs.sort((a, b) => parseFloat(a) - parseFloat(b));

            selLargeurPneu.innerHTML = '<option value="">-- Sélectionnez une largeur de pneu --</option>';
            largeurs.forEach(l => {
                selLargeurPneu.innerHTML += `<option value="${escapeHtml(l)}">${escapeHtml(l)}</option>`;
            });
            selLargeurPneu.disabled = false;
        }

        selLargeurPneu.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenL = selLargeurPneu.value;
            selRapport.innerHTML = '<option value="">-- Sélectionnez un rapport --</option>';
            selDiametrePneu.innerHTML = '<option value="">Sélectionnez d\'abord un rapport</option>';
            selRapport.disabled = true;
            selDiametrePneu.disabled = true;
            rapportField.classList.remove('hidden');
            tireSearchPanel.classList.remove('results-search-panel--two-columns');
            diametreLabel.textContent = '3. Diamètre pneu';
            selectedWidthHasRapports = true;
            resultsContainer.classList.add('hidden');

            if (!chosenL) return;

            const filtered = pneuRows.filter(item => item.largeurPneu === chosenL);
            const rapports = [...new Set(filtered.map(item => item.rapport))].filter(Boolean);
            rapports.sort((a, b) => parseFloat(a) - parseFloat(b));

            if (rapports.length === 0) {
                selectedWidthHasRapports = false;
                rapportField.classList.add('hidden');
                tireSearchPanel.classList.add('results-search-panel--two-columns');
                diametreLabel.textContent = '2. Diamètre pneu';
                selDiametrePneu.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
                const diametres = [...new Set(filtered.map(item => item.diametrePneu))].filter(Boolean);
                diametres.sort((a, b) => parseFloat(a) - parseFloat(b));
                diametres.forEach(d => {
                    selDiametrePneu.innerHTML += `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`;
                });
                selDiametrePneu.disabled = false;
                return;
            }

            rapports.forEach(r => {
                selRapport.innerHTML += `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`;
            });
            selRapport.disabled = false;
        });

        selRapport.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenL = selLargeurPneu.value;
            const chosenR = selRapport.value;
            selDiametrePneu.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
            selDiametrePneu.disabled = true;
            resultsContainer.classList.add('hidden');

            if (!chosenR) return;

            const filtered = pneuRows.filter(item => item.largeurPneu === chosenL && item.rapport === chosenR);
            const diametres = [...new Set(filtered.map(item => item.diametrePneu))].filter(Boolean);
            diametres.sort((a, b) => parseFloat(a) - parseFloat(b));

            diametres.forEach(d => {
                selDiametrePneu.innerHTML += `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`;
            });
            selDiametrePneu.disabled = false;
        });

        selDiametrePneu.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenL = selLargeurPneu.value;
            const chosenR = selRapport.value;
            const chosenD = selDiametrePneu.value;

            if (!chosenD) {
                resultsContainer.classList.add('hidden');
                return;
            }

            const matchingPneus = pneuRows.filter(item => 
                item.largeurPneu === chosenL && 
                (!selectedWidthHasRapports || item.rapport === chosenR) &&
                item.diametrePneu === chosenD
            );

            // Collecte de tous les tarifs correspondants bruts
            let rawMatches = [];
            matchingPneus.forEach(pneu => {
                const matchedTarifs = tarifsData.filter(t => 
                    normalizeStr(t.largeurJante) === normalizeStr(pneu.largeurJante) && 
                    normalizeStr(t.diametre) === normalizeStr(pneu.diametrePneu)
                );
                rawMatches.push(...matchedTarifs);
            });

            // SUPPRESSION DES DOUBLONS (Basée sur l'unicité du nom du produit / colonne F)
            const uniqueMatches = [];
            const seenNames = new Set();
            rawMatches.forEach(match => {
                const identifier = normalizeStr(match.nom);
                if (identifier && !seenNames.has(identifier)) {
                    seenNames.add(identifier);
                    uniqueMatches.push(match);
                }
            });

            let html = '';

            uniqueMatches.forEach(match => {
                html += `
                    <div class="bg-[#070913] border border-gray-800 p-4 rounded-xl space-y-3 mb-3">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold">Nom du produit (Jante ${escapeHtml(match.largeurJante)})</span>
                            <div class="text-white text-base font-bold tracking-wide">${escapeHtml(match.nom || 'N/A')}</div>
                        </div>
                        
                        <div class="pt-2 border-t border-gray-800/80">
                `;

                const baseVV = parseFloat(match.prixVV.replace(',', '.')) || 0;
                const finalVV = userRemise > 0 ? baseVV * (1 - userRemise / 100) : baseVV;
                
                html += `
                    <div class="results-price-block">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie variable (Roue étroite)</span>
                `;

                if (userRemise > 0) {
                    html += `
                            <div class="text-[10px] text-gray-400 mt-0.5">Prix BRUT : <span class="text-white font-medium">${baseVV.toFixed(2)} €</span></div>
                        </div>
                        <div data-net-price ${netPriceVisible ? '' : 'hidden'} class="results-price-block__net">
                            <div class="text-[10px] uppercase tracking-wider text-red-400 font-semibold">Prix NET</div>
                            <div class="text-white font-bold text-base">${finalVV.toFixed(2)} €</div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="text-[10px] uppercase tracking-wider text-gray-500 mt-0.5">Prix BRUT</div>
                        </div>
                        <div class="results-price-block__net">
                            <div class="text-white font-bold text-base">${finalVV.toFixed(2)} €</div>
                        </div>
                    `;
                }
                html += `</div></div>`;

                const hasValidI = match.deportMaxI && !isNaN(parseFloat(match.deportMaxI));
                const hasValidJ = match.deportMinJ && !isNaN(parseFloat(match.deportMinJ));

                if (hasValidI && hasValidJ) {
                    html += `
                        <div class="pt-2">
                            <button onclick='ouvrirCalculateur(${escapeHtml(JSON.stringify(match))})' class="results-primary-action">
                                Estimer la voie de travail
                            </button>
                        </div>
                    `;
                }

                html += `</div>`;
            });

            if (!html) {
                resultsContent.innerHTML = `<div class="p-4 bg-gray-900/50 border border-gray-800 text-gray-400 text-xs rounded-xl text-center">Aucune roue étroite tarifée trouvée pour cette dimension de pneu.</div>`;
            } else {
                resultsContent.innerHTML = html;
            }

            updateNetPriceVisibility();
            resultsContainer.classList.remove('hidden');
        });

        window.ouvrirCalculateur = function(product) {
            if (!pageAuthorized) return;

            sessionStorage.setItem('ermas_calc_product', JSON.stringify(product));
            window.location.href = 'calcul-voie.html?source=roues-etroites-pneu';
        };

        initPage().catch(() => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
