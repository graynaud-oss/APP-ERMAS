<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Recherche Jumelages par Taille de Jante</title>
    <!-- Favicon personnalisé -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 id="page-title" class="font-brand text-xl sm:text-2xl font-bold text-white">Jumelages - Recherche par Jante</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Sélectionnez les dimensions étape par étape</p>
                </div>
                <button onclick="retourJumelages()" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
            </div>

            <!-- ÉTAPE 1 : DIAMÈTRE (Col B) -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">1. Diamètre</label>
                <select id="select-diametre" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Chargement des données...</option>
                </select>
            </div>

            <!-- ÉTAPE 2 : LARGEUR DE JANTE (Col A) -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">2. Largeur de jante</label>
                <select id="select-largeur" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord un diamètre</option>
                </select>
            </div>

            <!-- ÉTAPE 3 : NOMBRE DE TENDEURS (Col F) -->
            <div class="mb-6">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">3. Nombre de tendeurs</label>
                <select id="select-tendeurs" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord une largeur</option>
                </select>
            </div>

            <!-- RÉSULTATS (TARIFS & OPTIONS) -->
            <div id="results-container" class="hidden space-y-3 pt-4 border-t border-gray-800">
                <h3 class="text-xs uppercase tracking-wider text-red-500 font-semibold mb-2">Produit correspondant :</h3>
                <div id="results-content" class="space-y-3">
                    <!-- Injecté dynamiquement -->
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        &copy; 2026 ERMAS - Tous droits réservés.
    </footer>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const URLS_CSV = {
            'EVO': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=1732806915&single=true&output=csv',
            '360': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=1287684735&single=true&output=csv'
        };

        const supabaseClient = getSupabaseClient();

        let csvData = [];
        let userRemise = 0;
        let gammeType = null;
        let backDestination = 'jumelages.html';
        let pageAuthorized = false;

        window.retourJumelages = function() {
            window.location.href = backDestination;
        };

        const selDiametre = document.getElementById('select-diametre');
        const selLargeur = document.getElementById('select-largeur');
        const selTendeurs = document.getElementById('select-tendeurs');
        const resultsContainer = document.getElementById('results-container');
        const resultsContent = document.getElementById('results-content');

        async function initPage() {
            let context;
            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            if (context.profile && context.profile.remise) {
                userRemise = parseFloat(context.profile.remise) || 0;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const requestedType = urlParams.get('type');
            gammeType = urlParams.get('type') || 'EVO';
            backDestination = requestedType === 'EVO' || requestedType === '360'
                ? `jumelages-choix.html?type=${requestedType}`
                : 'jumelages.html';
            document.getElementById('page-title').textContent = `Jumelages (Gamme ${gammeType}) - Par Taille de Jantes`;
            pageAuthorized = true;

            try {
                const response = await fetch(URLS_CSV[gammeType]);
                const text = await response.text();
                parseCSV(text);
                restaurerSelections();
            } catch (err) {
                selDiametre.innerHTML = '<option value="">Erreur de chargement des données</option>';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            csvData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 7) {
                    csvData.push({
                        largeurJante: cols[0] || '', // Col A
                        diametre: cols[1] || '',     // Col B
                        colC: cols[2] || '',         // Col C (DEPORT MAX)
                        colD: cols[3] || '',         // Col D (DEPORT MIN)
                        nom: cols[4] || '',          // Col E (Nom du produit)
                        tendeurs: cols[5] || '',     // Col F (Nb tendeurs)
                        prix: cols[6] || '',         // Col G (Prix principal)
                        kitSansJantes: cols[7] || '',// Col H
                        joncs: cols[8] || '',        // Col I
                        paireTendeurs: cols[9] || '',// Col J
                        entretoises: cols[10] || ''  // Col K
                    });
                }
            }
            populateDiametres();
        }

        function populateDiametres() {
            const diametres = [...new Set(csvData.map(item => item.diametre))].filter(Boolean);
            diametres.sort((a, b) => parseFloat(a) - parseFloat(b));

            selDiametre.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
            diametres.forEach(d => {
                selDiametre.innerHTML += `<option value="${d}">${d}</option>`;
            });
            selDiametre.disabled = false;
        }

        function sauvegarderSelections() {
            sessionStorage.setItem('ermas_jante_diametre', selDiametre.value);
            sessionStorage.setItem('ermas_jante_largeur', selLargeur.value);
            sessionStorage.setItem('ermas_jante_tendeurs', selTendeurs.value);
        }

        function restaurerSelections() {
            const savedD = sessionStorage.getItem('ermas_jante_diametre');
            const savedL = sessionStorage.getItem('ermas_jante_largeur');
            const savedT = sessionStorage.getItem('ermas_jante_tendeurs');

            if (savedD && [...selDiametre.options].some(o => o.value === savedD)) {
                selDiametre.value = savedD;
                selDiametre.dispatchEvent(new Event('change'));

                if (savedL && [...selLargeur.options].some(o => o.value === savedL)) {
                    selLargeur.value = savedL;
                    selLargeur.dispatchEvent(new Event('change'));

                    if (savedT && [...selTendeurs.options].some(o => o.value === savedT)) {
                        selTendeurs.value = savedT;
                        selTendeurs.dispatchEvent(new Event('change'));
                    }
                }
            }
        }

        selDiametre.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenD = selDiametre.value;
            selLargeur.innerHTML = '<option value="">-- Sélectionnez une largeur --</option>';
            selTendeurs.innerHTML = '<option value="">Sélectionnez d\'abord une largeur</option>';
            selLargeur.disabled = true;
            selTendeurs.disabled = true;
            resultsContainer.classList.add('hidden');
            sauvegarderSelections();

            if (!chosenD) return;

            const filtered = csvData.filter(item => item.diametre === chosenD);
            const largeurs = [...new Set(filtered.map(item => item.largeurJante))].filter(Boolean);
            largeurs.sort((a, b) => parseFloat(a) - parseFloat(b));

            largeurs.forEach(l => {
                selLargeur.innerHTML += `<option value="${l}">${l}</option>`;
            });
            selLargeur.disabled = false;
        });

        selLargeur.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenD = selDiametre.value;
            const chosenL = selLargeur.value;
            selTendeurs.innerHTML = '<option value="">-- Sélectionnez un nombre de tendeurs --</option>';
            selTendeurs.disabled = true;
            resultsContainer.classList.add('hidden');
            sauvegarderSelections();

            if (!chosenL) return;

            const filtered = csvData.filter(item => item.diametre === chosenD && item.largeurJante === chosenL);
            const tendeursList = [...new Set(filtered.map(item => item.tendeurs))].filter(Boolean);
            tendeursList.sort((a, b) => parseInt(a) - parseInt(b));

            tendeursList.forEach(t => {
                selTendeurs.innerHTML += `<option value="${t}">${t} tendeurs</option>`;
            });
            selTendeurs.disabled = false;
        });

        selTendeurs.addEventListener('change', () => {
            if (!pageAuthorized) return;

            const chosenD = selDiametre.value;
            const chosenL = selLargeur.value;
            const chosenT = selTendeurs.value;
            sauvegarderSelections();

            if (!chosenT) {
                resultsContainer.classList.add('hidden');
                return;
            }

            const matchingItems = csvData.filter(item => 
                item.diametre === chosenD && 
                item.largeurJante === chosenL && 
                item.tendeurs === chosenT
            );

            // Filtrage strict des doublons/triples basé sur le NOM (col E) et les TENDEURS (col F)
            const uniqueMap = new Map();
            matchingItems.forEach(item => {
                const uniqueKey = `${(item.nom || '').trim().toLowerCase()}_${(item.tendeurs || '').trim().toLowerCase()}`;
                if (!uniqueMap.has(uniqueKey)) {
                    uniqueMap.set(uniqueKey, item);
                }
            });
            const matches = Array.from(uniqueMap.values());

            if (matches.length === 0) {
                resultsContainer.classList.add('hidden');
                return;
            }

            let html = '';

            matches.forEach(match => {
                html += `
                    <div class="bg-[#070913] border border-gray-800 p-4 rounded-xl space-y-4 mb-3">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold">Nom du produit</span>
                            <div class="text-white text-base font-bold tracking-wide mt-0.5">${match.nom || 'N/A'}</div>
                        </div>
                `;

                // TARIF PRINCIPAL (G) avec gestion catalogue et net remisé
                if (match.prix && !isNaN(parseFloat(match.prix))) {
                    const basePrix = parseFloat(match.prix);
                    const finalPrix = userRemise > 0 ? basePrix * (1 - userRemise / 100) : basePrix;

                    html += `
                        <div class="bg-gray-900/50 p-3.5 rounded-lg border border-gray-800">
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1">Tarif Principal</span>
                    `;

                    if (userRemise > 0) {
                        html += `
                            <div class="text-xs text-gray-400 pb-2 border-b border-gray-800/60 flex justify-between items-center">
                                <span>Prix catalogue :</span>
                                <span class="text-white font-medium">${basePrix.toFixed(2)} €</span>
                            </div>
                            <div class="flex justify-between items-center pt-2">
                                <span class="text-xs uppercase tracking-wider text-red-400 font-semibold">Prix net</span>
                                <span class="text-white font-extrabold text-lg">${finalPrix.toFixed(2)} €</span>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="flex justify-between items-center pt-1">
                                <span class="text-xs uppercase tracking-wider text-gray-400">Prix catalogue</span>
                                <span class="text-white font-extrabold text-lg">${finalPrix.toFixed(2)} €</span>
                            </div>
                        `;
                    }
                    html += `</div>`;
                } else {
                    html += `
                        <div class="bg-gray-900/50 p-3.5 rounded-lg border border-gray-800 flex justify-between items-center">
                            <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Tarif Principal</span>
                            <span class="text-gray-500 text-xs italic">Sur consultation</span>
                        </div>
                    `;
                }

                // OPTIONS DISCRÈTES (H, I, J, K)
                html += `
                    <div class="pt-2 border-t border-gray-800/80">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold mb-2">Options / Suppléments</span>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                `;

                const options = [
                    { label: 'Kit sans jantes', val: match.kitSansJantes },
                    { label: 'Suppl. joncs à boulonner', val: match.joncs },
                    { label: 'Paire tendeurs supp.', val: match.paireTendeurs },
                    { label: 'Suppl. entretoises étagées', val: match.entretoises }
                ];

                options.forEach(opt => {
                    if (opt.val && !isNaN(parseFloat(opt.val))) {
                        const baseOpt = parseFloat(opt.val);
                        const finalOpt = userRemise > 0 ? baseOpt * (1 - userRemise / 100) : baseOpt;

                        html += `
                            <div class="bg-gray-900/30 border border-gray-800/60 rounded-md p-2.5 flex flex-col justify-between text-xs">
                                <span class="text-gray-400 text-[11px] mb-1">${opt.label}</span>
                        `;

                        if (userRemise > 0) {
                            html += `
                                <div class="text-[10px] text-gray-400 pb-1 border-b border-gray-800/40 flex justify-between items-center">
                                    <span>Cat. :</span>
                                    <span class="text-white">${baseOpt.toFixed(2)} €</span>
                                </div>
                                <div class="flex justify-between items-center pt-1 font-medium">
                                    <span class="text-red-400 text-[10px]">Net :</span>
                                    <span class="text-gray-200">${finalOpt.toFixed(2)} €</span>
                                </div>
                            `;
                        } else {
                            html += `
                                <div class="flex justify-between items-center pt-1">
                                    <span class="text-gray-500 text-[10px]">Prix :</span>
                                    <span class="text-gray-200 font-medium">${finalOpt.toFixed(2)} €</span>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    } else {
                        html += `
                            <div class="bg-gray-900/30 border border-gray-800/60 rounded-md p-2.5 flex justify-between items-center text-xs">
                                <span class="text-gray-400 text-[11px]">${opt.label}</span>
                                <span class="text-gray-500 italic">N/C</span>
                            </div>
                        `;
                    }
                });

                html += `
                        </div>
                    </div>
                `;

                // BOUTON ACCÈS CALCULATEUR HORS-TOUT (pointant vers calcul-hors-tout.html)
                html += `
                    <div class="pt-2 border-t border-gray-800/80">
                        <button onclick='ouvrirCalculateurHorsTout(${JSON.stringify(match)})' class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-xs transition tracking-wide uppercase shadow-md shadow-red-950/50">
                            Calculer la largeur hors tout
                        </button>
                    </div>
                `;

                html += `</div>`;
            });

            resultsContent.innerHTML = html;
            resultsContainer.classList.remove('hidden');
        });

        window.ouvrirCalculateurHorsTout = function(product) {
            if (!pageAuthorized) return;

            sessionStorage.setItem('ermas_hors_tout_product', JSON.stringify(product));
            window.location.href = `calcul-hors-tout.html?type=${gammeType}&source=taille`;
        };

        initPage().catch(() => {
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
