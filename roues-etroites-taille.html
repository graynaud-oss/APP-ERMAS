<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Recherche Roues Étroites par Taille</title>
    <!-- Favicon personnalisé -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="font-brand text-xl sm:text-2xl font-bold text-white">Roues Étroites - Recherche par taille</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Sélectionnez les dimensions étape par étape</p>
                </div>
                <button onclick="history.back()" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
            </div>

            <!-- ÉTAPE 1 : DIAMÈTRE (Colonne B) -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">1. Diamètre</label>
                <select id="select-diametre" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Chargement des données...</option>
                </select>
            </div>

            <!-- ÉTAPE 2 : LARGEUR (Colonne A) -->
            <div class="mb-4">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">2. Largeur de jante</label>
                <select id="select-largeur" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord un diamètre</option>
                </select>
            </div>

            <!-- ÉTAPE 3 : NOMBRE DE TENDEURS (Colonne F) -->
            <div class="mb-6">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">3. Nombre de tendeurs</label>
                <select id="select-tendeurs" disabled class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition disabled:opacity-50">
                    <option value="">Sélectionnez d'abord une largeur</option>
                </select>
            </div>

            <!-- RÉSULTATS (NOM & PRIX) -->
            <div id="results-container" class="hidden space-y-3 pt-4 border-t border-gray-800">
                <h3 class="text-xs uppercase tracking-wider text-red-500 font-semibold mb-2">Produit correspondant :</h3>
                <div id="results-content" class="space-y-3">
                    <!-- Injecté dynamiquement -->
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        &copy; 2026 ERMAS - Tous droits réservés.
    </footer>

    <script>
        const SUPABASE_URL = 'https://wtxmaolhztuvujtgouaw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0eG1hb2xoenR1dnVqdGdvdWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjgzMDIsImV4cCI6MjEwMTQwNDMwMn0.ttuoJAutNJ98KDz45Te40VOqLyMIuda7n2CtaFK8IGg';
        
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=21297594&single=true&output=csv';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let csvData = [];
        let userRemise = 0;

        const selDiametre = document.getElementById('select-diametre');
        const selLargeur = document.getElementById('select-largeur');
        const selTendeurs = document.getElementById('select-tendeurs');
        const resultsContainer = document.getElementById('results-container');
        const resultsContent = document.getElementById('results-content');

        async function initPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('remise')
                .eq('id', session.user.id)
                .maybeSingle();

            if (profile && profile.remise) {
                userRemise = parseFloat(profile.remise) || 0;
            }

            try {
                const response = await fetch(SHEET_CSV_URL);
                const text = await response.text();
                parseCSV(text);
            } catch (err) {
                selDiametre.innerHTML = '<option value="">Erreur de chargement des données</option>';
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            csvData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(',').map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 12) {
                    const prixVFVal = cols[6];
                    const prixVVVal = cols[7];

                    const hasVF = prixVFVal && !isNaN(parseFloat(prixVFVal));
                    const hasVV = prixVVVal && !isNaN(parseFloat(prixVVVal));
                    if (!hasVF && !hasVV) continue;

                    csvData.push({
                        largeurJante: cols[0],      // Col A (Largeur)
                        diametre: cols[1],          // Col B (Diamètre)
                        nom: cols[4],               // Col E (Nom)
                        nombreTendeurs: cols[5],    // Col F (Nombre de tendeurs)
                        prixVF: prixVFVal,          // Col G
                        prixVV: prixVVVal,          // Col H
                        horsTout: cols[8],          // Col I
                        emboitement: cols[9],       // Col J
                        deportMaxI: cols[10],       // Col K
                        deportMinJ: cols[11]        // Col L
                    });
                }
            }
            populateDiametres();
        }

        function populateDiametres() {
            const diametres = [...new Set(csvData.map(item => item.diametre))].filter(Boolean);
            diametres.sort((a, b) => parseFloat(a) - parseFloat(b));

            selDiametre.innerHTML = '<option value="">-- Sélectionnez un diamètre --</option>';
            diametres.forEach(d => {
                selDiametre.innerHTML += `<option value="${d}">${d}</option>`;
            });
            selDiametre.disabled = false;
        }

        // Séquence : Diamètre -> Largeur -> Nombre de tendeurs
        selDiametre.addEventListener('change', () => {
            const chosenD = selDiametre.value;
            selLargeur.innerHTML = '<option value="">-- Sélectionnez une largeur --</option>';
            selTendeurs.innerHTML = '<option value="">Sélectionnez d\'abord une largeur</option>';
            selLargeur.disabled = true;
            selTendeurs.disabled = true;
            resultsContainer.classList.add('hidden');

            if (!chosenD) return;

            const filtered = csvData.filter(item => item.diametre === chosenD);
            const largeurs = [...new Set(filtered.map(item => item.largeurJante))].filter(Boolean);
            largeurs.sort((a, b) => parseFloat(a) - parseFloat(b));

            largeurs.forEach(l => {
                selLargeur.innerHTML += `<option value="${l}">${l}</option>`;
            });
            selLargeur.disabled = false;
        });

        selLargeur.addEventListener('change', () => {
            const chosenD = selDiametre.value;
            const chosenL = selLargeur.value;
            selTendeurs.innerHTML = '<option value="">-- Sélectionnez un nombre de tendeurs --</option>';
            selTendeurs.disabled = true;
            resultsContainer.classList.add('hidden');

            if (!chosenL) return;

            const filtered = csvData.filter(item => item.diametre === chosenD && item.largeurJante === chosenL);
            const tendeurs = [...new Set(filtered.map(item => item.nombreTendeurs))].filter(Boolean);
            tendeurs.sort((a, b) => parseFloat(a) - parseFloat(b));

            tendeurs.forEach(t => {
                selTendeurs.innerHTML += `<option value="${t}">${t}</option>`;
            });
            selTendeurs.disabled = false;
        });

        selTendeurs.addEventListener('change', () => {
            const chosenD = selDiametre.value;
            const chosenL = selLargeur.value;
            const chosenT = selTendeurs.value;

            const match = csvData.find(item => 
                item.diametre === chosenD && 
                item.largeurJante === chosenL && 
                item.nombreTendeurs === chosenT
            );

            if (!match) {
                resultsContainer.classList.add('hidden');
                return;
            }

            let html = `
                <div class="bg-[#070913] border border-gray-800 p-4 rounded-xl space-y-3">
                    <div>
                        <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold">Nom du produit</span>
                        <div class="text-white text-base font-bold tracking-wide">${match.nom || 'N/A'}</div>
                        <div class="text-xs text-gray-400 mt-0.5">Nombre de tendeurs : <span class="text-white font-medium">${match.nombreTendeurs}</span></div>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-800/80">
            `;

            // VOIE FIXE
            if (match.prixVF && !isNaN(parseFloat(match.prixVF))) {
                const baseVF = parseFloat(match.prixVF);
                const finalVF = userRemise > 0 ? baseVF * (1 - userRemise / 100) : baseVF;
                
                html += `
                    <div class="bg-gray-900/50 p-2.5 rounded-lg border border-gray-800 flex flex-col justify-between">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie fixe</span>
                `;
                
                if (userRemise > 0) {
                    html += `
                            <div class="text-[10px] text-gray-400 mt-1 pb-2 border-b border-gray-800/60">Prix catalogue : <span class="text-white font-medium">${baseVF.toFixed(2)} €</span></div>
                            <div class="text-[10px] uppercase tracking-wider text-red-400 font-semibold mt-2">Prix net</div>
                        </div>
                        <div>
                            <div class="text-white font-bold text-sm">${finalVF.toFixed(2)} €</div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Prix catalogue</div>
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-800/60">
                            <div class="text-white font-bold text-sm">${finalVF.toFixed(2)} €</div>
                        </div>
                    `;
                }
                html += `</div>`;
            } else {
                html += `
                    <div class="bg-gray-900/50 p-2.5 rounded-lg border border-gray-800 flex flex-col justify-between">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie fixe</span>
                        <div class="text-gray-500 text-xs italic my-auto">Non disponible</div>
                    </div>
                `;
            }

            // VOIE VARIABLE
            if (match.prixVV && !isNaN(parseFloat(match.prixVV))) {
                const baseVV = parseFloat(match.prixVV);
                const finalVV = userRemise > 0 ? baseVV * (1 - userRemise / 100) : baseVV;
                
                html += `
                    <div class="bg-gray-900/50 p-2.5 rounded-lg border border-gray-800 flex flex-col justify-between">
                        <div>
                            <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie variable</span>
                `;

                if (userRemise > 0) {
                    html += `
                            <div class="text-[10px] text-gray-400 mt-1 pb-2 border-b border-gray-800/60">Prix catalogue : <span class="text-white font-medium">${baseVV.toFixed(2)} €</span></div>
                            <div class="text-[10px] uppercase tracking-wider text-red-400 font-semibold mt-2">Prix net</div>
                        </div>
                        <div>
                            <div class="text-white font-bold text-sm">${finalVV.toFixed(2)} €</div>
                        </div>
                    `;
                } else {
                    html += `
                            <div class="text-[10px] uppercase tracking-wider text-gray-500 mt-1">Prix catalogue</div>
                        </div>
                        <div class="mt-2 pt-2 border-t border-gray-800/60">
                            <div class="text-white font-bold text-sm">${finalVV.toFixed(2)} €</div>
                        </div>
                    `;
                }
                html += `</div>`;
            } else {
                html += `
                    <div class="bg-gray-900/50 p-2.5 rounded-lg border border-gray-800 flex flex-col justify-between">
                        <span class="block text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Voie variable</span>
                        <div class="text-gray-500 text-xs italic my-auto">Non disponible</div>
                    </div>
                `;
            }

            html += `</div>`;

            // BOUTON DE CALCUL DE VOIE
            const hasValidI = match.deportMaxI && !isNaN(parseFloat(match.deportMaxI));
            const hasValidJ = match.deportMinJ && !isNaN(parseFloat(match.deportMinJ));

            if (hasValidI && hasValidJ) {
                html += `
                    <div class="pt-2">
                        <button onclick='ouvrirCalculateur(${JSON.stringify(match)})' class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2.5 rounded-lg text-xs transition tracking-wide uppercase shadow-md shadow-red-950/50">
                            Estimer la voie de travail
                        </button>
                    </div>
                `;
            }

            html += `</div>`;
            resultsContent.innerHTML = html;
            resultsContainer.classList.remove('hidden');
        });

        window.ouvrirCalculateur = function(product) {
            sessionStorage.setItem('ermas_calc_product', JSON.stringify(product));
            window.location.href = 'calcul-voie.html';
        };

        initPage();
    </script>
</body>
</html>
