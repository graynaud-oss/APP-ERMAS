<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Information Jumelages</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <link rel="stylesheet" href="css/app-ermas.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="information-view" class="hidden app-shell catalog-page">
        <header class="app-header"><div class="app-container app-header__inner"><img class="app-logo" src="assets/brand/ermas-logo.png" alt="ERMAS"></div></header>
        <main class="catalog-page__body"><div class="app-container"><section class="app-page-panel" aria-labelledby="information-title">
                <div class="app-page-header">
                    <div>
                        <p class="app-page-eyebrow">Information technique</p>
                        <h1 id="information-title" class="app-page-title"></h1>
                        <p class="app-page-subtitle">Sélectionnez une option :</p>
                    </div>
                    <button type="button" data-protected-route="jumelages.html" class="app-back-button">Retour</button>
                </div>

                <div class="app-information-panel">
                    <div id="information-power" class="app-information-power"></div>
                    <div id="information-message" class="app-information-message"></div>
                </div>

                <div class="app-information-actions">
                    <button type="button" data-protected-route="jumelages.html" class="app-back-button">
                        Retour au catalogue
                    </button>
                </div>
        </section></div></main>

        <footer class="app-footer">
            <div class="app-container app-footer__inner">
                <p>&copy; 2026 ERMAS - Tous droits réservés.</p>
                <nav class="app-footer__links" aria-label="Informations juridiques">
                    <a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a>
                    <span aria-hidden="true">|</span>
                    <a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>
                </nav>
            </div>
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const supabaseClient = getSupabaseClient();
        const informationView = document.getElementById('information-view');
        let pageAuthorized = false;

        const INFORMATION_BY_TYPE = Object.freeze({
            TGD: Object.freeze({
                title: 'Catalogue Jumelages - TGD',
                power: '120 à 250 cv',
                message: 'Contenu de la rubrique Jumelages TGD en cours de configuration.'
            }),
            'TGD+': Object.freeze({
                title: 'Catalogue Jumelages - TGD+',
                power: '160 à 400 cv',
                message: 'Contenu de la rubrique Jumelages TGD+ en cours de configuration.'
            })
        });

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            const information = Object.hasOwn(INFORMATION_BY_TYPE, type)
                ? INFORMATION_BY_TYPE[type]
                : null;

            if (!information) {
                window.location.href = 'jumelages.html';
                return;
            }

            document.getElementById('information-title').textContent = information.title;
            document.getElementById('information-power').textContent = information.power;
            document.getElementById('information-message').textContent = information.message;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            informationView.classList.remove('hidden');
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
