<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Information Jumelages</title>
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">
    <div id="information-view" class="hidden h-full flex flex-col justify-between w-full">
        <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
            <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h2 id="information-title" class="font-brand text-xl sm:text-2xl font-bold text-white"></h2>
                        <p class="text-xs text-gray-400 mt-0.5">Sélectionnez une option :</p>
                    </div>
                    <button type="button" data-protected-route="jumelages.html" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
                </div>

                <div class="space-y-4 mb-6">
                    <div id="information-power" class="text-xs text-red-400 font-semibold text-center"></div>
                    <div id="information-message" class="p-4 bg-[#070913] border border-gray-800 rounded-xl text-center text-gray-400 text-sm"></div>
                </div>

                <div class="text-center">
                    <button type="button" data-protected-route="jumelages.html" class="px-6 py-2.5 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg transition tracking-wider uppercase text-xs shadow-lg shadow-red-950/50">
                        Retour au catalogue
                    </button>
                </div>
            </div>
        </div>

        <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
            &copy; 2026 ERMAS - Tous droits réservés.
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        const supabaseClient = getSupabaseClient();
        const informationView = document.getElementById('information-view');
        let pageAuthorized = false;

        const INFORMATION_BY_TYPE = Object.freeze({
            TGD: Object.freeze({
                title: 'Catalogue Jumelages - TGD',
                power: '120 à 250 cv',
                message: 'Contenu de la rubrique Jumelages TGD en cours de configuration.'
            }),
            'TGD+': Object.freeze({
                title: 'Catalogue Jumelages - TGD+',
                power: '160 à 400 cv',
                message: 'Contenu de la rubrique Jumelages TGD+ en cours de configuration.'
            })
        });

        async function initPage() {
            let context;

            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            pageAuthorized = true;

            const urlParams = new URLSearchParams(window.location.search);
            const type = urlParams.get('type');
            const information = Object.hasOwn(INFORMATION_BY_TYPE, type)
                ? INFORMATION_BY_TYPE[type]
                : null;

            if (!information) {
                window.location.href = 'jumelages.html';
                return;
            }

            document.getElementById('information-title').textContent = information.title;
            document.getElementById('information-power').textContent = information.power;
            document.getElementById('information-message').textContent = information.message;

            document.querySelectorAll('[data-protected-route]').forEach((button) => {
                button.addEventListener('click', () => {
                    if (!pageAuthorized) return;
                    window.location.href = button.dataset.protectedRoute;
                });
            });

            informationView.classList.remove('hidden');
        }

        initPage().catch(() => {
            pageAuthorized = false;
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
