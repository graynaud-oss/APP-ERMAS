<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Calcul de Largeur Hors Tout</title>
    <!-- Favicon personnalisé -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <div>
                    <h2 class="font-brand text-xl sm:text-2xl font-bold text-white">Calcul de Largeur Hors Tout</h2>
                    <p id="product-name" class="text-xs text-amber-400 mt-0.5 font-medium">Chargement du produit...</p>
                </div>
                <button onclick="history.back()" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
            </div>

            <!-- CHAMPS DE SAISIE -->
            <div class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">1. Voie actuelle de l'engin (mm)</label>
                    <input type="number" id="input-voie" step="0.1" placeholder="Ex: 1500" class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">2. Largeur de jante engin</label>
                    <select id="select-jante-engin" class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition">
                        <option value="">Chargement des jantes...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">3. Largeur entretoise souhaitée (mm)</label>
                    <input type="number" id="input-entretoise" step="0.1" placeholder="Ex: 200" class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition">
                </div>

                <button id="btn-calculer" class="w-full bg-red-600 hover:bg-red-500 text-white font-brand uppercase tracking-wider font-bold py-3 rounded-lg transition shadow-lg shadow-red-900/20">Calculer la largeur hors tout</button>
            </div>

            <!-- RÉSULTAT -->
            <div id="result-section" class="hidden bg-[#070913] border border-gray-800 p-4 rounded-xl space-y-2 text-center">
                <span class="text-xs uppercase tracking-wider text-gray-400 font-semibold">Largeur Hors Tout de l'engin :</span>
                <div id="res-hors-tout" class="text-2xl font-extrabold text-green-400 font-brand">-</div>
            </div>

        </div>
    </div>

    <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        &copy; 2026 ERMAS - Tous droits réservés.
    </footer>

    <script>
        const SUPABASE_URL = 'https://wtxmaolhztuvujtgouaw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0eG1hb2xoenR1dnVqdGdvdWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjgzMDIsImV4cCI6MjEwMTQwNDMwMn0.ttuoJAutNJ98KDz45Te40VOqLyMIuda7n2CtaFK8IGg';

        const urlParams = new URLSearchParams(window.location.search);
        const gammeType = urlParams.get('type') || 'EVO';

        // URL pointant vers le bon onglet CSV contenant les jantes engins
        const URL_JANTES_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=1966421754&single=true&output=csv';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        const productNameEl = document.getElementById('product-name');
        const inputVoie = document.getElementById('input-voie');
        const selectJanteEngin = document.getElementById('select-jante-engin');
        const inputEntretoise = document.getElementById('input-entretoise');
        const btnCalculer = document.getElementById('btn-calculer');
        const resultSection = document.getElementById('result-section');
        const resHorsTout = document.getElementById('res-hors-tout');

        let selectedProduct = null;
        let jantesEnginData = [];

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            selectedProduct = JSON.parse(sessionStorage.getItem('ermas_hors_tout_product'));
            if (!selectedProduct) {
                window.history.back();
                return;
            }

            productNameEl.textContent = `${selectedProduct.nom || ''} ${selectedProduct.tendeurs ? '(' + selectedProduct.tendeurs + ' tendeurs)' : ''}`;

            try {
                const res = await fetch(URL_JANTES_CSV);
                const text = await res.text();
                parseJantesCSV(text);
            } catch (err) {
                selectJanteEngin.innerHTML = '<option value="">Erreur de chargement des jantes</option>';
            }
        }

        function parseJantesCSV(text) {
            const lines = text.split('\n');
            jantesEnginData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 4) {
                    jantesEnginData.push({
                        taille: cols[0] || '', 
                        horsToutJante: parseFloat(cols[2]) || 0, 
                        emboitementEngin: parseFloat(cols[3]) || 0  
                    });
                }
            }

            if (jantesEnginData.length === 0) {
                selectJanteEngin.innerHTML = '<option value="">Aucune jante trouvée</option>';
                return;
            }

            selectJanteEngin.innerHTML = '<option value="">-- Sélectionnez une largeur de jante engin --</option>';
            jantesEnginData.forEach(j => {
                if (j.taille) {
                    selectJanteEngin.innerHTML += `<option value="${j.taille}">${j.taille}</option>`;
                }
            });
        }

        btnCalculer.addEventListener('click', () => {
            const voie = parseFloat(inputVoie.value);
            const selectedJanteTaille = selectJanteEngin.value;
            const entretoiseSouhaitee = parseFloat(inputEntretoise.value);

            if (isNaN(voie) || !selectedJanteTaille || isNaN(entretoiseSouhaitee)) {
                alert('Veuillez remplir tous les champs correctement.');
                return;
            }

            const janteEngin = jantesEnginData.find(j => j.taille.toLowerCase() === selectedJanteTaille.toLowerCase());
            if (!janteEngin) {
                alert('Jante engin introuvable.');
                return;
            }

            const horsToutJumelage = parseFloat(selectedProduct.colC) || 0; 
            const emboitementJumelage = parseFloat(selectedProduct.colD) || 0; 

            const horsToutJanteEngin = janteEngin.horsToutJante;
            const emboitementJanteEngin = janteEngin.emboitementEngin;

            const resultat = (voie + horsToutJumelage) 
                           + (2 * horsToutJanteEngin) 
                           + (2 * entretoiseSouhaitee) 
                           - (2 * emboitementJanteEngin) 
                           - (2 * emboitementJumelage);

            resHorsTout.textContent = resultat.toFixed(1) + ' mm';
            resultSection.classList.remove('hidden');
        });

        init();
    </script>
</body>
</html>
