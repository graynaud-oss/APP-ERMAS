<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Calcul de Largeur Hors Tout</title>
    <link rel="icon" type="image/png" href="assets/brand/favicon.png">
    <link rel="shortcut icon" href="assets/brand/favicon.ico">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/app-ermas.css">
    <script type="module" src="./js/logout.js"></script>
</head>
<body>
    <div class="app-shell calculator-page">
        <header class="app-header">
            <div class="app-container app-header__inner">
                <a class="app-logo-link" href="https://www.ermas.fr/" target="_blank" rel="noopener noreferrer" aria-label="Ouvrir le site ERMAS"><img class="app-logo" src="assets/brand/ermas-logo.png" alt=""></a>
                <button type="button" class="app-logout-button" data-global-logout>Se déconnecter</button>
            </div>
        </header>

        <!-- CONTENU PRINCIPAL -->
        <main class="calculator-page__body">
            <div class="app-container calculator-container">
            <section class="app-page-panel calculator-panel" aria-labelledby="calcul-hors-tout-title">
            <div class="app-page-header">
                <div>
                    <p class="app-page-eyebrow">Outil technique · Jumelages</p>
                    <h1 id="calcul-hors-tout-title" class="app-page-title">Calcul de Largeur Hors Tout</h1>
                </div>
                <button type="button" onclick="retourCalculHorsTout()" class="app-back-button">Retour</button>
            </div>

            <div class="calculator-product">
                <span class="calculator-product__label">Produit sélectionné</span>
                <p id="product-name" class="calculator-product__name">Chargement du produit...</p>
            </div>

            <!-- CHAMPS DE SAISIE -->
            <div class="calculator-form">
                <div class="calculator-field">
                    <label for="input-voie">1. Voie actuelle de l'engin (mm)</label>
                    <input type="number" id="input-voie" step="0.1" placeholder="Ex: 1500">
                </div>

                <div class="calculator-field">
                    <label for="select-jante-engin">2. Largeur de jante engin</label>
                    <select id="select-jante-engin">
                        <option value="">Chargement des jantes...</option>
                    </select>
                </div>

                <div class="calculator-field">
                    <label for="input-entretoise">3. Largeur entretoise souhaitée (mm)</label>
                    <input type="number" id="input-entretoise" step="0.1" placeholder="Ex: 200">
                </div>

                <button id="btn-calculer" class="calculator-primary-action">Calculer la largeur hors tout</button>
            </div>

            <!-- RÉSULTAT -->
            <div id="result-section" class="hidden calculator-results calculator-results--single">
                <span class="calculator-result-card__label">Largeur Hors Tout de l'engin (Matériel fer, Hors pneu) :</span>
                <div id="res-hors-tout" class="calculator-result-card__value calculator-result-card__value--primary">-</div>
            </div>
            </section>
            </div>
        </main>

        <footer class="app-footer">
            <div class="app-container app-footer__inner">
                <p>&copy; 2026 ERMAS - Tous droits réservés.</p>
                <nav class="app-footer__links" aria-label="Informations juridiques">
                    <a href="https://www.ermas.fr/mentions-legales" target="_blank" rel="noopener noreferrer">Mentions légales</a>
                    <span aria-hidden="true">|</span>
                    <a href="https://www.ermas.fr/politique-confidentialite" target="_blank" rel="noopener noreferrer">Politique de confidentialité</a>
                </nav>
            </div>
        </footer>
    </div>

    <script type="module">
        import { getSupabaseClient } from './js/supabase-client.js';
        import { AUTHORIZATION_STATES, requireAuthorizedUser } from './js/auth-guard.js';

        // URLs CSV adaptées selon la gamme (EVO ou 360)
        const URLS_JANTES_CSV = {
            'EVO': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=1732806915&single=true&output=csv',
            '360': 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTWjGoPLparHgevFFnvi4cOqQk-q12ZqXSJzZEOWQDr7p-5DRPE4zTuWKXPQQh9m4eZRVHql-B8tf1F/pub?gid=1287684735&single=true&output=csv'
        };
        const RETURN_DESTINATIONS = Object.freeze({
            taille: Object.freeze({
                EVO: 'jumelages-jantes-taille.html?type=EVO',
                '360': 'jumelages-jantes-taille.html?type=360'
            }),
            pneu: Object.freeze({
                EVO: 'jumelages-jantes-pneu.html?type=EVO',
                '360': 'jumelages-jantes-pneu.html?type=360'
            })
        });

        const supabaseClient = getSupabaseClient();

        const productNameEl = document.getElementById('product-name');
        const inputVoie = document.getElementById('input-voie');
        const selectJanteEngin = document.getElementById('select-jante-engin');
        const inputEntretoise = document.getElementById('input-entretoise');
        const btnCalculer = document.getElementById('btn-calculer');
        const resultSection = document.getElementById('result-section');
        const resHorsTout = document.getElementById('res-hors-tout');

        let selectedProduct = null;
        let jantesEnginData = [];
        let gammeType = null;
        let backDestination = 'jumelages.html';
        let pageAuthorized = false;

        window.retourCalculHorsTout = function() {
            window.location.href = backDestination;
        };

        async function init() {
            let context;
            try {
                context = await requireAuthorizedUser({ client: supabaseClient });
            } catch (error) {
                window.location.href = 'index.html';
                return;
            }

            if (context.state !== AUTHORIZATION_STATES.AUTHORIZED) {
                window.location.href = 'index.html';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const typeParam = urlParams.get('type');
            const sourceParam = urlParams.get('source');
            gammeType = urlParams.get('type') || 'EVO';
            backDestination = RETURN_DESTINATIONS[sourceParam]?.[typeParam] || 'jumelages.html';

            selectedProduct = JSON.parse(sessionStorage.getItem('ermas_hors_tout_product'));
            if (!selectedProduct) {
                window.location.href = 'jumelages.html';
                return;
            }

            productNameEl.textContent = `${selectedProduct.nom || ''} ${selectedProduct.tendeurs ? '(' + selectedProduct.tendeurs + ' tendeurs)' : ''} [Gamme ${gammeType}]`;
            pageAuthorized = true;

            try {
                const csvUrl = URLS_JANTES_CSV[gammeType] || URLS_JANTES_CSV['EVO'];
                const res = await fetch(csvUrl);
                const text = await res.text();
                parseJantesCSV(text);
            } catch (err) {
                selectJanteEngin.innerHTML = '<option value="">Erreur de chargement des jantes</option>';
            }
        }

        function parseJantesCSV(text) {
            const lines = text.split('\n');
            jantesEnginData = [];

            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(val => val.trim().replace(/^"|"$/g, ''));
                
                if (cols.length >= 7) {
                    jantesEnginData.push({
                        taille: cols[0] || '',       // Col A (Largeur de jante)
                        horsToutJante: parseFloat(cols[2]) || 0, // Col C (Déport max)
                        emboitementEngin: parseFloat(cols[3]) || 0 // Col D (Déport min)
                    });
                }
            }

            if (jantesEnginData.length === 0) {
                selectJanteEngin.innerHTML = '<option value="">Aucune jante trouvée</option>';
                return;
            }

            // Filtrage des doublons sur la taille de jante
            const uniqueTailles = [...new Set(jantesEnginData.map(j => j.taille))].filter(Boolean);
            uniqueTailles.sort((a, b) => parseFloat(a) - parseFloat(b));

            selectJanteEngin.innerHTML = '<option value="">-- Sélectionnez une largeur de jante engin --</option>';
            uniqueTailles.forEach(taille => {
                selectJanteEngin.innerHTML += `<option value="${taille}">${taille}</option>`;
            });
        }

        btnCalculer.addEventListener('click', () => {
            if (!pageAuthorized) return;

            const voie = parseFloat(inputVoie.value);
            const selectedJanteTaille = selectJanteEngin.value;
            const entretoiseSouhaitee = parseFloat(inputEntretoise.value);

            if (isNaN(voie) || !selectedJanteTaille || isNaN(entretoiseSouhaitee)) {
                alert('Veuillez remplir tous les champs correctement.');
                return;
            }

            const janteEngin = jantesEnginData.find(j => j.taille.toLowerCase() === selectedJanteTaille.toLowerCase());
            if (!janteEngin) {
                alert('Jante engin introuvable.');
                return;
            }

            const horsToutJumelage = parseFloat(selectedProduct.colC) || 0; 
            const emboitementJumelage = parseFloat(selectedProduct.colD) || 0; 

            const horsToutJanteEngin = janteEngin.horsToutJante;
            const emboitementJanteEngin = janteEngin.emboitementEngin;

            const resultat = (voie + horsToutJumelage) 
                           + (2 * horsToutJanteEngin) 
                           + (2 * entretoiseSouhaitee) 
                           - (2 * emboitementJanteEngin) 
                           - (2 * emboitementJumelage);

            resHorsTout.textContent = resultat.toFixed(1) + ' mm';
            resultSection.classList.remove('hidden');
        });

        init();
    </script>
</body>
</html>
