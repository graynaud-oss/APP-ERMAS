<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERMAS - Calcul Largeur Hors Tout</title>
    <!-- Favicon personnalisé -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/15om2TV_YaY4mP-dIn80LSdyeJJjG0PMF">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070913; color: #f3f4f6; }
        .font-brand { font-family: 'Rajdhani', sans-serif; }
    </style>
</head>
<body class="h-full flex flex-col justify-between antialiased">

    <!-- CONTENU PRINCIPAL -->
    <div class="flex-grow flex flex-col items-center justify-center px-4 py-8">
        <div class="max-w-xl w-full bg-[#0b101d] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 id="page-title" class="font-brand text-xl sm:text-2xl font-bold text-white">Calcul Largeur Hors Tout</h2>
                    <p class="text-xs text-gray-400 mt-0.5">Calcul basé sur la voie et les déports</p>
                </div>
                <button onclick="history.back()" class="text-xs text-gray-400 hover:text-white uppercase tracking-wider bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-lg transition shrink-0">Retour</button>
            </div>

            <!-- INFOS PRODUIT SÉLECTIONNÉ -->
            <div id="product-info" class="bg-gray-900/50 border border-gray-800 rounded-xl p-4 mb-6">
                <span class="block text-[10px] uppercase tracking-wider text-gray-500 font-semibold mb-1">Produit sélectionné</span>
                <div id="product-name" class="text-white font-bold text-sm">Chargement...</div>
                <div class="grid grid-cols-2 gap-4 mt-3 pt-3 border-t border-gray-800/80 text-xs">
                    <div>
                        <span class="text-gray-500 block text-[10px]">Déport Max (I)</span>
                        <span id="val-i" class="text-gray-200 font-semibold">-</span>
                    </div>
                    <div>
                        <span class="text-gray-500 block text-[10px]">Déport Min (J)</span>
                        <span id="val-j" class="text-gray-200 font-semibold">-</span>
                    </div>
                </div>
            </div>

            <!-- FORMULAIRE DE SAISIE VOIE -->
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">Voie actuelle de l'engin (mm)</label>
                    <input type="number" id="input-voie" placeholder="Ex: 1500" class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition">
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-semibold">Position du jumelage</label>
                    <select id="select-position" class="w-full bg-[#070913] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-red-600 transition">
                        <option value="max">Déport Max (I)</option>
                        <option value="min">Déport Min (J)</option>
                    </select>
                </div>

                <button onclick="calculerHorsTout()" class="w-full bg-red-600 hover:bg-red-500 text-white font-brand uppercase tracking-wider text-xs font-bold py-3 rounded-lg transition shadow-md shadow-red-900/20">
                    Calculer
                </button>
            </div>

            <!-- RÉSULTAT -->
            <div id="result-box" class="hidden bg-gray-900 border border-gray-800 rounded-xl p-5 text-center space-y-2">
                <span class="block text-xs uppercase tracking-wider text-red-500 font-semibold">LARGEUR HORS TOUT DE L'ENGIN : (Materiel fer, hors pneus)</span>
                <div id="result-value" class="text-3xl font-extrabold text-white font-brand">0 mm</div>
                <p id="result-details" class="text-xs text-gray-400"></p>
            </div>
        </div>
    </div>

    <footer class="bg-[#0b101d] border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        &copy; 2026 ERMAS - Tous droits réservés.
    </footer>

    <script>
        const SUPABASE_URL = 'https://wtxmaolhztuvujtgouaw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0eG1hb2xoenR1dnVqdGdvdWF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4MjgzMDIsImV4cCI6MjEwMTQwNDMwMn0.ttuoJAutNJ98KDz45Te40VOqLyMIuda7n2CtaFK8IGg';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true }
        });

        let currentProduct = null;

        async function initPage() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = 'index.html';
                return;
            }

            const storedProduct = sessionStorage.getItem('ermas_hors_tout_product');
            if (!storedProduct) {
                document.getElementById('product-name').textContent = "Aucun produit sélectionné.";
                return;
            }

            currentProduct = JSON.parse(storedProduct);

            let nomAffichage = currentProduct.nom || 'Produit sans nom';
            if (currentProduct.tendeurs && currentProduct.tendeurs.trim() !== '') {
                nomAffichage += ` - ${currentProduct.tendeurs} TENDEURS`;
            }

            document.getElementById('product-name').textContent = nomAffichage;
            document.getElementById('val-i').textContent = currentProduct.colC ? `${currentProduct.colC} mm` : 'N/C';
            document.getElementById('val-j').textContent = currentProduct.colD ? `${currentProduct.colD} mm` : 'N/C';
        }

        function calculerHorsTout() {
            if (!currentProduct) return;

            const voieInput = document.getElementById('input-voie').value;
            const position = document.getElementById('select-position').value;

            if (!voieInput || isNaN(voieInput)) {
                alert("Veuillez saisir une valeur de voie valide.");
                return;
            }

            const voie = parseFloat(voieInput);
            let deport = 0;

            if (position === 'max') {
                deport = parseFloat(currentProduct.colC);
            } else {
                deport = parseFloat(currentProduct.colD);
            }

            if (isNaN(deport)) {
                alert("La valeur du déport pour ce produit n'est pas renseignée ou invalide.");
                return;
            }

            // Formule de calcul hors-tout : Voie + (2 * Déport)
            const horsTout = voie + (2 * deport);

            const resultBox = document.getElementById('result-box');
            const resultValue = document.getElementById('result-value');
            const resultDetails = document.getElementById('result-details');

            resultValue.textContent = `${horsTout.toFixed(1)} mm (${(horsTout / 1000).toFixed(3)} m)`;
            resultDetails.textContent = `Calcul : Voie (${voie} mm) + 2 × Déport ${position === 'max' ? 'Max (I)' : 'Min (J)'} (${deport} mm)`;
            
            resultBox.classList.remove('hidden');
        }

        initPage();
    </script>
</body>
</html>
